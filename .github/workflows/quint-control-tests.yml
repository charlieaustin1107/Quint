name: Quint Control tests
on:
  push:
    branches: [main, "quint-control/**"]
    paths:
      - "quint-control/**"
      - ".github/workflows/quint-control-tests.yml"
  pull_request:
    paths:
      - "quint-control/**"
      - ".github/workflows/quint-control-tests.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cd quint-control && npm test
      - run: cd quint-control && npm run test:3
