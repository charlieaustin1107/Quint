name: Quint product checks

on:
  push:
    branches: [main]
    paths:
      - "chart-wizard/**"
      - "quint-brain/**"
      - "lab/**"
      - "docs/**"
      - "CLAUDE.md"
      - ".claude/skills/quint-trading/**"
      - ".github/workflows/quint-product-checks.yml"
  pull_request:
    paths:
      - "chart-wizard/**"
      - "quint-brain/**"
      - "lab/**"
      - "docs/**"
      - "CLAUDE.md"
      - ".claude/skills/quint-trading/**"
      - ".github/workflows/quint-product-checks.yml"

permissions:
  contents: read

jobs:
  lab:
    name: Quint Lab Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: cd lab && npm test
      - run: cd lab && npm run test:3

  browser-apps:
    name: Chart Wizard and Quint Brain
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Build Chart Wizard
        run: |
          cd chart-wizard/src
          python build.py
          python build.py --prod
      - name: Build Quint Brain
        run: |
          cd quint-brain/src
          python extract.py "$(cat roots.txt)" "$(cat mine.txt)"
          python patch.py
          python build.py
          python build.py --prod
      - name: Run Chart Wizard browser tests
        run: |
          set -e
          python chart-wizard/src/t/dock.py m
          for test in feed.py prac_offline.py t6.py coach_prod2.py prod_quint.py hud.py voice.py draw.py talk.py fx.py tvlog.py; do
            python "chart-wizard/src/t/$test"
          done
      - name: Run Quint Brain browser tests
        run: |
          set -e
          for test in t_qa.py t_brain.py t_daily.py t_prod.py t_voice.py t_talk.py t_fx.py t_pacing.py; do
            python "quint-brain/src/$test"
          done
      - name: Cross-check Quint Brain backtest
        run: |
          python quint-brain/backtest/extract_engine.py
          node quint-brain/backtest/run.js
          python quint-brain/backtest/crosscheck.py
