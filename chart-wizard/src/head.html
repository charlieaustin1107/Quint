<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chart Wizard</title>
<style>
:root {
  /* One trading terminal: toolbar + chart + coaching panel. Chart colours validated for colour-blind separation on the dark surface. */
  --bg0: #060912;
  --bg: #0b1020;
  --panel: #0d1324;
  --card: #111a2f;
  --card2: #16213b;
  --line: #1d2842;
  --line2: #2a3758;
  --grid: #131b30;
  --ink: #c9d3e6;
  --ink-hi: #f2f6ff;
  --muted: #8691aa;
  --up: #26a69a;
  --down: #ef5350;
  --ema: #2962ff;
  --sma: #a8b0c2;
  --rsi: #9575cd;
  --amber: #c07c10;
  --acc: #22d3ee;
  --acc2: #8b5cf6;
  --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, Ubuntu, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; background: var(--bg0); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
.panel, .sheet, .tools, .pop, .nav, .nav .nbody, .scrim, .navbg { touch-action: pan-y; overscroll-behavior: contain; } /* sideways swipes never become the browser back gesture */
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--acc); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
b { color: var(--ink-hi); font-weight: 650; }
#app { height: 100%; display: flex; flex-direction: column; }

/* ---------- top bar ---------- */
.tb { flex: none; display: flex; align-items: center; gap: 6px; height: 50px; padding: 0 8px; padding-top: env(safe-area-inset-top); background: linear-gradient(180deg, #0c1326, #0a0f1e); border-bottom: 1px solid var(--line); position: relative; }
.tb::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, rgba(34,211,238,.55), rgba(139,92,246,.55), transparent); }
.sym { display: flex; align-items: center; gap: 7px; border: 0; background: transparent; padding: 6px 8px; border-radius: 8px; min-width: 0; }
.sym:hover { background: var(--card); }
.sym .logo { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 800; color: #04101a; background: linear-gradient(135deg, var(--acc), var(--acc2)); flex: none; }
.sym b { font-size: 15px; letter-spacing: .01em; white-space: nowrap; }
.sym .car { color: var(--muted); font-size: 11px; }
.tbtn { height: 34px; min-width: 34px; padding: 0 9px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); font-size: 13px; font-weight: 650; display: inline-flex; align-items: center; justify-content: center; gap: 4px; white-space: nowrap; }
.tbtn:hover { border-color: var(--line2); background: var(--card2); }
.tbtn .sim { font-size: 9px; font-weight: 800; letter-spacing: .06em; color: var(--acc); }
.tfrow { display: none; gap: 2px; }
.tfrow button { border: 0; background: transparent; color: var(--muted); font-size: 13px; font-weight: 650; padding: 6px 8px; border-radius: 6px; }
.tfrow button:hover { color: var(--ink-hi); background: var(--card); }
.tfrow button[aria-pressed="true"] { color: var(--ink-hi); background: var(--card2); box-shadow: inset 0 -2px 0 var(--acc); }
@media (min-width: 900px) { .tfrow { display: flex; } #tfbtn { display: none; } }
.spacer { flex: 1; }
.rank { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 4px 9px 4px 5px; height: 38px; }
.rank:hover { border-color: var(--line2); }
.rank svg { flex: none; filter: drop-shadow(0 0 6px rgba(34,211,238,.45)); }
.rank .rt { display: flex; flex-direction: column; line-height: 1.1; text-align: left; min-width: 0; }
.rank .rt small { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; white-space: nowrap; }
.rank .rt span { font-size: 14px; font-weight: 800; color: var(--ink-hi); white-space: nowrap; transition: color .3s; }
.rank .rt span.flash-up { color: #5fd3c7; } .rank .rt span.flash-down { color: #ff8a87; }
.xpbar { position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; z-index: 2; }
.xpbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--acc), var(--acc2)); box-shadow: 0 0 10px rgba(34,211,238,.7); transition: width .6s cubic-bezier(.2,.8,.2,1); }
@media (max-width: 420px) { .sym b { font-size: 14px; } .sym .car, .sym .logo { display: none; } .sym { padding: 6px 4px; } .tb { gap: 4px; padding: 0 6px; } .tbtn { padding: 0 7px; min-width: 32px; } .rank { padding: 4px 8px 4px 4px; gap: 6px; } }
@media (max-width: 340px) { .rank .rt small { display: none; } }

/* ---------- main ---------- */
.main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
.chartarea { flex: 1 1 auto; min-height: 220px; display: flex; position: relative; background: var(--bg); }
.tools { flex: none; width: 42px; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; scrollbar-width: none; }
.tools::-webkit-scrollbar { display: none; }
.tool { width: 34px; height: 34px; flex: none; border: 0; border-radius: 8px; background: transparent; color: var(--muted); display: grid; place-items: center; position: relative; }
.tool:hover { color: var(--ink-hi); background: var(--card); }
.tool[aria-pressed="true"] { color: #04121a; background: linear-gradient(135deg, var(--acc), #67e8f9); box-shadow: 0 0 12px rgba(34,211,238,.45); }
.tool.toggle[aria-pressed="true"] { color: var(--acc); background: rgba(34,211,238,.12); box-shadow: inset 0 0 0 1px rgba(34,211,238,.45); }
.tool svg { width: 20px; height: 20px; }
.tsep { width: 22px; height: 1px; background: var(--line); margin: 4px 0; flex: none; }
.chartwrap { position: relative; flex: 1; min-width: 0; }
canvas#cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
canvas#cv.drawing { cursor: copy; }
.legend { position: absolute; left: 8px; top: 6px; right: 70px; pointer-events: none; font-size: 12px; line-height: 1.55; text-shadow: 0 0 4px var(--bg), 0 0 2px var(--bg); }
.legend .l1 { color: var(--ink-hi); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend .dim { color: var(--muted); }
.legend .v { margin-right: 8px; white-space: nowrap; }
.legend > div:not(.l1) { display: flex; flex-wrap: wrap; } /* wrap between values, never under the price axis */
.legend .u { color: var(--up); } .legend .d { color: var(--down); }
.legend .ema { color: #6f94ff; } .legend .sma { color: var(--sma); } .legend .rsi { color: #b39ddb; }
.badge { display: inline-block; font-size: 9.5px; font-weight: 800; letter-spacing: .07em; padding: 1px 5px; border-radius: 4px; vertical-align: 1px; margin-left: 4px; }
.badge.sim { color: #04121a; background: var(--acc); }
.badge.real { color: var(--ink-hi); background: var(--card2); border: 1px solid var(--line2); }
.selbar { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); display: none; align-items: center; gap: 4px; padding: 4px; border-radius: 10px; background: rgba(17,26,47,.96); border: 1px solid var(--line2); box-shadow: 0 8px 24px rgba(0,0,0,.45); z-index: 5; }
.selbar.open { display: flex; }
.selbar .sw { width: 22px; height: 22px; border-radius: 50%; border: 2px solid transparent; padding: 0; }
.selbar .sw[aria-pressed="true"] { border-color: var(--ink-hi); }
.selbar .del { border: 0; background: rgba(239,83,80,.16); color: #ff8a87; border-radius: 7px; padding: 5px 10px; font-size: 13px; font-weight: 700; }
.selbar .ok { border: 0; background: var(--card2); border-radius: 7px; padding: 5px 10px; font-size: 13px; font-weight: 700; }
.toast { position: absolute; left: 50%; top: 52px; transform: translateX(-50%); background: rgba(17,26,47,.96); border: 1px solid rgba(34,211,238,.4); color: var(--ink-hi); font-size: 13px; padding: 7px 12px; border-radius: 9px; pointer-events: none; opacity: 0; transition: opacity .2s; white-space: nowrap; z-index: 4; max-width: 92%; overflow: hidden; text-overflow: ellipsis; }
.toast.show { opacity: 1; }
.cbtns { position: absolute; right: 70px; bottom: 30px; display: flex; gap: 6px; z-index: 3; }
.cbtn { height: 28px; min-width: 28px; padding: 0 8px; border-radius: 7px; border: 1px solid var(--line2); background: rgba(17,26,47,.9); color: var(--ink); font-size: 12px; font-weight: 700; }
.cbtn[hidden] { display: none; }
.cbtn svg { display: block; margin: 0 auto; }
#app.fs .tb, #app.fs .coach { display: none !important; }
#app.fs .main { padding-top: env(safe-area-inset-top); }
#app.fs .panel { height: auto; overflow: hidden; padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
#app.fs .panel .pane, #app.fs .panel .grip { display: none; }
#app.fs .panel .mini { display: flex; }
#app.fs .cbtn#fsb { color: #04121a; background: linear-gradient(135deg, var(--acc), #67e8f9); border-color: transparent; }
@media (min-width: 960px) { #app.fs .panel { display: none; } }
.cbtn.live { color: #a5f3fc; border-color: rgba(34,211,238,.55); background: rgba(8,47,73,.92); }

.panel { flex: none; height: 46%; min-height: 0; overflow-y: auto; background: var(--panel); border-top: 1px solid var(--line); padding: 12px 14px calc(16px + env(safe-area-inset-bottom)); position: relative; overscroll-behavior: contain; }
.panel.min { height: auto; overflow: hidden; padding-top: 6px; padding-bottom: calc(6px + env(safe-area-inset-bottom)); }
.panel.min .pane { display: none; }
.panel .mini { display: none; }
.panel.min .mini { display: flex; }
.grip { display: flex; justify-content: center; margin: -6px 0 6px; }
.grip button { border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 14px; border-radius: 6px; }
.grip button:hover { color: var(--ink-hi); }
.mini { align-items: center; justify-content: space-between; gap: 10px; font-size: 13px; }
@media (min-width: 960px) {
  .main { flex-direction: row; }
  .panel { height: auto; width: 420px; border-top: 0; border-left: 1px solid var(--line); }
  .grip { display: none; }
}
.pane { display: flex; flex-direction: column; gap: 11px; max-width: 640px; margin: 0 auto; }

/* ---------- Quint ---------- */
.cbtn.coachb { color: #e9d5ff; border-color: rgba(167,139,250,.6); background: linear-gradient(135deg, rgba(76,29,149,.92), rgba(30,27,75,.92)); box-shadow: 0 0 14px rgba(139,92,246,.35); }
.cbtn.coachb[aria-pressed="true"] { background: linear-gradient(135deg, #8b5cf6, #6d28d9); color: #fff; }
.coach { flex: none; height: 56%; min-height: 0; display: flex; flex-direction: column; background: var(--panel); border-top: 1px solid rgba(139,92,246,.45); position: relative; }
.coach[hidden] { display: none; }
#app.co .panel { display: none; }
.chead { flex: none; display: flex; align-items: center; gap: 6px; padding: 8px 10px 8px 14px; border-bottom: 1px solid var(--line); }
.chead .ct { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; }
.chead .ct b { color: #ddd6fe; font-size: 14px; }
.chead .ct small { color: var(--muted); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chead .cbtn { position: static; }
.cmsgs { flex: 1; min-height: 0; overflow-y: auto; position: relative; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; touch-action: pan-y; overscroll-behavior: contain; }
.cmsg { max-width: 92%; font-size: 14px; line-height: 1.5; border-radius: 14px; padding: 9px 12px; overflow-wrap: anywhere; }
.cmsg.u { align-self: flex-end; background: linear-gradient(135deg, #4c1d95, #312e81); color: #f5f3ff; border-bottom-right-radius: 4px; }
.cmsg.a { align-self: flex-start; background: var(--card); border: 1px solid var(--line); color: var(--ink); border-bottom-left-radius: 4px; }
.cmsg.a.err { border-color: rgba(239,83,80,.5); }
.cmsg p { margin: 0 0 7px; } .cmsg p:last-child { margin-bottom: 0; }
.cmsg p.ch { font-weight: 750; color: #ddd6fe; font-size: 13px; text-transform: uppercase; letter-spacing: .05em; margin: 12px 0 4px; } .cmsg p.ch:first-child { margin-top: 0; }
.cmsg.a { max-width: 100%; }
.cmsg ul, .cmsg ol { margin: 0 0 7px; padding-left: 20px; } .cmsg li { margin: 2px 0; }
.cmsg code { font-size: 12.5px; background: var(--bg); border-radius: 4px; padding: 1px 4px; }
.cmsg .dim { color: var(--muted); animation: cpulse 1.2s ease-in-out infinite; }
@keyframes cpulse { 50% { opacity: .45; } }
.cacts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; padding-top: 8px; border-top: 1px dashed var(--line2); }
.cact { border: 1px solid rgba(167,139,250,.55); background: rgba(76,29,149,.35); color: #e9d5ff; font-size: 12px; font-weight: 650; border-radius: 999px; padding: 4px 10px; }
.cq { flex: none; margin: 8px 10px 0; padding: 9px 11px; border-radius: 12px; background: var(--card); border: 1px solid rgba(34,211,238,.35); display: flex; flex-direction: column; gap: 7px; max-height: 45%; overflow-y: auto; touch-action: pan-y; }
.cq[hidden] { display: none; }
.cqh { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.cqh .qk { font-size: 10.5px; }
.cqline { min-width: 0; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 13px; color: var(--ink); }
.cqline b { color: var(--acc); font-weight: 700; margin-right: 4px; }
.cread { display: block; margin: 0 0 8px auto; border: 1px solid var(--line2); background: var(--bg); color: var(--ink-hi); border-radius: 999px; padding: 6px 12px; font-size: 12.5px; font-weight: 650; }
.cqx { flex: none; border: 0; background: transparent; color: var(--muted); font-size: 12px; padding: 2px 4px; }
.cqt { font-size: 14px; font-weight: 700; color: var(--ink-hi); line-height: 1.35; }
.cqo { display: flex; flex-wrap: wrap; gap: 6px; }
.cqo.one { flex-wrap: nowrap; overflow-x: auto; touch-action: pan-x; scrollbar-width: none; align-items: center; } .cqo.one::-webkit-scrollbar { display: none; }
.cqo.one .cqb { flex: none; min-height: 34px; padding: 5px 10px; white-space: nowrap; } .cqo.one .cqv { flex: none; white-space: nowrap; font-size: 13px; }
.cqb { border: 1px solid var(--line2); background: var(--bg); color: var(--ink); border-radius: 9px; padding: 7px 10px; font-size: 13px; font-weight: 600; text-align: left; min-height: 36px; }
.cqb b { color: var(--acc); margin-right: 4px; }
.cqb.pri { border: 0; color: #04121a; background: linear-gradient(135deg, var(--acc), #a78bfa); }
.cqb.ask { border-color: rgba(167,139,250,.6); background: rgba(76,29,149,.35); color: #e9d5ff; }
.cqv { font-size: 13.5px; font-weight: 700; } .cqv.pos { color: var(--up); } .cqv.neg { color: var(--down); } .cqv.warn { color: #e7b35a; }
.tfnote { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 13px; color: var(--ink); background: var(--bg); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 10px; }
.tfnote b { color: var(--acc); } .tfnote i { font-style: normal; color: var(--up); font-size: 12px; font-weight: 650; }
.tfnote.warn { border-color: rgba(231,179,90,.6); background: rgba(120,80,10,.18); }
.tfnote .btn { min-height: 34px; padding: 5px 12px; font-size: 13px; }
.btn.coachask { border-color: rgba(167,139,250,.6); background: rgba(76,29,149,.3); color: #e9d5ff; }
.acct.prop .pbar, .acard .pbar { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; align-items: center; margin-top: 8px; font-size: 12.5px; color: var(--muted); }
.acct.prop .pbar .bar, .acard .pbar .bar { grid-column: 1 / -1; height: 7px; border-radius: 99px; background: var(--bg); overflow: hidden; }
.acct.prop .pbar .bar i, .acard .pbar .bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #26a69a, #5eead4); }
.acct.prop .pbar.dd .bar i, .acard .pbar.dd .bar i { background: linear-gradient(90deg, #ef5350, #e7b35a 40%, #26a69a); }
.acct.prop .pbar b, .acard .pbar b { color: var(--ink-hi); font-weight: 700; grid-row: 1; grid-column: 2; }
details.rules { margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: var(--card); }
details.rules summary { cursor: pointer; font-weight: 700; color: var(--ink-hi); }
.rankup.prop { border-color: rgba(231,179,90,.7); }
.small.warn { color: #e7b35a; }
.tipbox { border: 1px solid rgba(34,211,238,.3); background: rgba(8,47,73,.35); border-radius: 10px; padding: 8px 11px; font-size: 13.5px; }
.tipbox b, .tipbox summary { color: #a5f3fc; font-weight: 700; } .tipbox summary { cursor: pointer; } .tipbox p { margin: 5px 0 0; line-height: 1.5; }
.strats { display: flex; flex-direction: column; gap: 8px; }
details.strat { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 12px; }
details.strat[open] { border-color: rgba(34,211,238,.45); }
details.strat summary { display: flex; gap: 10px; align-items: center; cursor: pointer; list-style: none; }
details.strat summary::-webkit-details-marker { display: none; }
details.strat .si { font-size: 24px; } details.strat .sn { display: flex; flex-direction: column; } details.strat .sn small { color: var(--muted); font-size: 11.5px; }
details.strat h4 { margin: 12px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--acc); }
details.strat p { margin: 6px 0; font-size: 13.5px; line-height: 1.5; } details.strat a { color: var(--acc); }
details.strat .btn { width: 100%; margin-top: 8px; }
table.bt td, table.bt th { font-size: 12px; padding: 4px 6px; }
.rapidhd { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 13px; color: var(--ink); }
.rprog { height: 4px; border-radius: 99px; background: var(--bg); overflow: hidden; margin: 6px 0 10px; } .rprog i { display: block; height: 100%; background: linear-gradient(90deg, #f59e0b, #fde047); }
.rapidq h2 { font-size: 22px; }
.orders.big .ord { min-height: 84px; } .orders.big .ord b { font-size: 24px; }
@media (max-width: 959px) { .rapidq .orders.big { position: static; margin: 0; padding: 0; background: none; } }
.rapidres { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px; border-radius: 14px; margin-bottom: 10px; animation: rpop .35s ease-out; }
.rapidres.win { background: rgba(38,166,154,.16); border: 1px solid rgba(38,166,154,.5); } .rapidres.loss { background: rgba(239,83,80,.14); border: 1px solid rgba(239,83,80,.45); }
.rapidres .big { font-size: 30px; font-weight: 800; } .rapidres.win .big { color: var(--up); } .rapidres.loss .big { color: var(--down); }
@keyframes rpop { from { transform: scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
.rapidwhat { font-size: 13.5px; line-height: 1.5; margin: 0 0 10px; }
.rcount { height: 3px; border-radius: 99px; background: var(--bg); overflow: hidden; margin-top: 8px; } .rcount i { display: block; height: 100%; background: var(--acc); animation: rcount 2.6s linear forwards; }
@keyframes rcount { from { width: 0; } to { width: 100%; } }
@media (prefers-reduced-motion: reduce) { .rapidres { animation: none; } }
/* ---------- navigation drawer ---------- */
.navb { gap: 8px; padding: 0 10px; }
.navb .hb { display: inline-flex; flex-direction: column; gap: 3px; } .navb .hb i { display: block; width: 16px; height: 2px; border-radius: 2px; background: currentColor; }
.navb .ml { font-weight: 700; font-size: 13px; white-space: nowrap; max-width: 150px; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 900px) { .navb .ml { display: none; } .navb { padding: 0 9px; } }
.navbg { position: fixed; inset: 0; z-index: 40; background: rgba(2,6,16,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
.navbg.open { opacity: 1; pointer-events: auto; }
.nav { position: fixed; z-index: 41; top: 0; bottom: 0; left: 0; width: min(340px, 88vw); display: flex; flex-direction: column; background: linear-gradient(180deg, #0c1326, #0a0f1e); border-right: 1px solid var(--line2); box-shadow: 12px 0 40px rgba(0,0,0,.45); transform: translateX(-102%); transition: transform .22s ease-out; padding-top: env(safe-area-inset-top); touch-action: pan-y; }
.nav.open { transform: none; }
@media (prefers-reduced-motion: reduce) { .nav, .navbg { transition: none; } }
.nav .nh { display: flex; align-items: center; gap: 10px; padding: 14px 14px 10px; border-bottom: 1px solid var(--line); }
.nav .nh .brand { flex: 1; min-width: 0; display: flex; flex-direction: column; line-height: 1.2; } .nav .nh .brand b { font-size: 16px; color: var(--ink-hi); } .nav .nh .brand small { color: var(--muted); font-size: 12px; }
.nav .nbody { flex: 1; overflow-y: auto; overscroll-behavior: contain; padding: 6px 10px 18px; }
.nav h6 { margin: 14px 6px 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 800; }
.nav .ni { width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; border: 1px solid transparent; background: transparent; color: var(--ink); border-radius: 12px; padding: 9px 10px; min-height: 48px; }
.nav .ni:hover { background: rgba(255,255,255,.04); }

/* round header */
.rh { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }

.event { display: flex; flex-direction: column; gap: 4px; background: linear-gradient(135deg, rgba(192,124,16,.13), rgba(17,26,47,.6)); border: 1px solid rgba(192,124,16,.45); border-radius: 12px; padding: 10px 12px; }

.row { display: flex; gap: 8px; flex-wrap: wrap; }

.fbh { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

/* playbook checklist & timer */

.today { border: 1px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px; margin: 12px 0 4px; }

/* ---------- Quint: holographic console look for the AI chat ---------- */
.coach { --q1: #22d3ee; --q2: #a78bfa; --q3: #f0abfc; --qmono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace; border-top: 0;
  background: radial-gradient(120% 60% at 50% -10%, rgba(34,211,238,.13), transparent 60%), radial-gradient(90% 50% at 100% 100%, rgba(167,139,250,.12), transparent 60%),
    linear-gradient(rgba(120,160,255,.045) 1px, transparent 1px) 0 0 / 100% 26px, linear-gradient(90deg, rgba(120,160,255,.045) 1px, transparent 1px) 0 0 / 26px 100%, #060a16; }

.qdot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 6px; background: #34d399; box-shadow: 0 0 8px #34d399; animation: qblink 2.4s ease-in-out infinite; vertical-align: 1px; }
@keyframes qblink { 50% { opacity: .35; } }
.qorb { flex: none; position: relative; width: 34px; height: 34px; border-radius: 50%; background: conic-gradient(from 0deg, var(--q1), var(--q2), var(--q3), var(--q1)); animation: qspin 6s linear infinite; box-shadow: 0 0 16px rgba(34,211,238,.45), 0 0 30px rgba(167,139,250,.25); }
.qorb::before { content: ""; position: absolute; inset: 2px; border-radius: 50%; background: #060a16; }
.qorb i { position: absolute; inset: 9px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff, var(--q1) 40%, #0e7490 75%); box-shadow: 0 0 12px var(--q1); animation: qcore 2.6s ease-in-out infinite; }
.qorb.big { width: 48px; height: 48px; margin: 0 auto 10px; } .qorb.big i { inset: 13px; }
.cempty { margin: 0; padding-top: 10px; }
@keyframes qspin { to { transform: rotate(360deg); } } @keyframes qcore { 50% { transform: scale(.78); opacity: .8; } }
.coach.busy .qorb { animation-duration: 1.4s; } .coach.busy .qorb i { animation-duration: .8s; }
