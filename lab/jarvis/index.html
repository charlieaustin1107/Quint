<style>
/* Layout: a phone app (390px first): sticky clock header, five screens, a bottom tab bar; panels flow into two columns from 900px.
   Obsidian & chrome (quint-design skill): true black, chrome silver, colour only for meaning (mint up, rose down, amber warning). */
:root {
  --bg: #000000; --s1: #060606; --s2: #0c0c0c; --s3: #151515; --s4: #1d1d1d;
  --line: rgba(255,255,255,.09); --line2: rgba(255,255,255,.18); --hi: rgba(255,255,255,.06);
  --fg: #f1f1f1; --mut: #a6a6a6; --dim: #6e6e6e;
  --mint: #2fd9a8; --rose: #ff4f6e; --amber: #ffb547;
  --chrome: linear-gradient(180deg, #ffffff 0%, #dcdcdc 34%, #8f8f8f 62%, #d4d4d4 100%);
  --display: "Chakra Petch", "Avenir Next Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", system-ui, sans-serif;
  --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --tabbar: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font: 15px/1.55 var(--body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 24px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--fg); }
.wrap { max-width: 1080px; margin: 0 auto; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--bg); display: flex; align-items: center; justify-content: space-between; gap: 10px; padding-block: 10px; border-bottom: 1px solid var(--line); }
.brand { font: 600 15px/1 var(--display); letter-spacing: .22em; text-transform: uppercase; white-space: nowrap; flex: none; background: var(--chrome); -webkit-background-clip: text; background-clip: text; color: transparent; }
.clock { display: flex; gap: 10px; align-items: center; min-width: 0; font: 400 11px/1.2 var(--mono); color: var(--mut); white-space: nowrap; }
.clock b { color: var(--fg); font-weight: 500; }
.screen { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding-top: 14px; }
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: 14px; box-shadow: inset 0 1px 0 var(--hi); padding: 16px; min-width: 0; }
.label { font: 600 11px/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--mut); margin: 0 0 12px; display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.label .r { letter-spacing: .04em; text-transform: none; font: 400 11px/1 var(--mono); color: var(--dim); }
h2 { font: 600 19px/1.25 var(--display); margin: 0; text-wrap: balance; }
p { margin: 0; }
.small { font-size: 12px; color: var(--dim); }
.mut { color: var(--mut); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.up { color: var(--mint); } .down { color: var(--rose); } .warn { color: var(--amber); }
.hero { display: grid; justify-items: center; gap: 12px; text-align: center; padding-block: 20px 18px; }
#core { width: 168px; height: 168px; max-width: 100%; display: block; }
.headline { font: 600 20px/1.3 var(--display); max-width: 30ch; text-wrap: balance; }
.btn { appearance: none; border: 0; border-radius: 999px; min-height: 48px; padding: 0 22px; font: 600 13px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; cursor: pointer; color: #000; background: var(--chrome); box-shadow: inset 0 1px 0 #fff; }
.btn[aria-pressed="true"] { background: var(--s3); color: var(--fg); box-shadow: inset 0 0 0 1px var(--line2); }
.btn.sm { min-height: 40px; padding: 0 16px; font-size: 12px; }
.ghost { appearance: none; background: var(--s2); color: var(--fg); border: 1px solid var(--line); border-radius: 12px; min-height: 44px; min-width: 44px; padding: 0 14px; font: 500 14px/1 var(--body); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; text-decoration: none; }
.ghost[aria-pressed="true"] { background: var(--chrome); color: #000; border-color: transparent; }
.ghost.danger { color: var(--rose); }
:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.row2 { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--s2); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.tile b { display: block; font: 500 19px/1.2 var(--mono); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.tile span { display: block; font-size: 12px; color: var(--mut); margin-top: 4px; }
.bar { height: 6px; background: var(--s3); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.bar i { display: block; height: 100%; background: var(--chrome); border-radius: inherit; }
.list { display: grid; gap: 8px; }
.item { display: grid; gap: 4px; padding: 10px 12px; background: var(--s2); border-radius: 10px; min-width: 0; border: 1px solid transparent; }
button.item { text-align: left; cursor: pointer; width: 100%; appearance: none; color: inherit; }
.item .t { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.item .n { font-weight: 500; min-width: 0; overflow-wrap: anywhere; }
.item .m { font: 400 12px/1.6 var(--mono); color: var(--mut); font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.pill { flex: none; font: 600 10px/1 var(--display); letter-spacing: .1em; text-transform: uppercase; padding: 6px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--mut); white-space: nowrap; }
.pill.good { color: var(--mint); border-color: rgba(47,217,168,.45); }
.pill.warn { color: var(--amber); border-color: rgba(255,181,71,.45); }
.pill.bad { color: var(--rose); border-color: rgba(255,79,110,.45); }
.checks { display: grid; gap: 8px; }
.check { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; appearance: none; width: 100%; background: var(--s2); border: 1px solid var(--line); border-radius: 12px; padding: 10px; cursor: pointer; color: inherit; }
.check .box { width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line2); display: grid; place-items: center; font: 600 13px/1 var(--display); color: var(--mut); }
.check[aria-pressed="true"] { border-color: rgba(47,217,168,.5); }
.check[aria-pressed="true"] .box { background: var(--mint); color: #000; border-color: transparent; }
.check b { display: block; font-weight: 600; }
.check span { display: block; font-size: 13px; color: var(--mut); margin-top: 2px; }
.verdict { padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line2); font-weight: 500; }
.verdict.good { border-color: rgba(47,217,168,.5); color: var(--mint); }
.verdict.bad { border-color: rgba(255,79,110,.5); color: var(--rose); }
.verdict.warn { border-color: rgba(255,181,71,.5); color: var(--amber); }
.seg { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { flex: none; appearance: none; border: 1px solid var(--line); background: transparent; color: var(--mut); border-radius: 999px; min-height: 38px; padding: 0 14px; font: 500 13px var(--body); cursor: pointer; }
.seg button[aria-selected="true"] { background: var(--chrome); color: #000; border-color: transparent; }
form.grid, .formgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: 12px; color: var(--mut); }
input[type=text], input[type=number], input[type=date], select, textarea { width: 100%; min-height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); color: var(--fg); font-size: 16px; padding: 0 12px; }
textarea { padding: 10px 12px; min-height: 80px; resize: vertical; }
.out { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.chat { display: grid; gap: 10px; }
.msg { padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.you { background: var(--s3); justify-self: end; max-width: 88%; }
.msg.quint { background: var(--s2); border: 1px solid var(--line); }
.msg.err { color: var(--amber); }
.ask form { display: flex; gap: 8px; }
.ask input { flex: 1; min-width: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { appearance: none; border: 1px solid var(--line); background: transparent; color: var(--mut); border-radius: 999px; min-height: 36px; padding: 0 12px; font: 13px var(--body); cursor: pointer; }
.lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.lines li { padding: 10px 12px; border-radius: 10px; background: var(--s2); border: 1px solid transparent; color: var(--mut); }
.lines li.on { color: var(--fg); border-color: var(--line2); }
details.fold { background: var(--s2); border-radius: 10px; padding: 10px 12px; }
details.fold + details.fold { margin-top: 8px; }
details.fold summary { cursor: pointer; display: flex; justify-content: space-between; gap: 10px; align-items: center; list-style: none; min-height: 28px; font-weight: 500; }
details.fold summary::-webkit-details-marker { display: none; }
details.fold .body { margin-top: 8px; color: var(--mut); font-size: 14px; display: grid; gap: 6px; }
ul.plain, ol.plain { margin: 0; padding-left: 20px; display: grid; gap: 6px; color: var(--mut); }
.scroll { overflow-x: auto; }
table.t { border-collapse: collapse; width: 100%; font-size: 13px; }
table.t th, table.t td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t th { font: 600 10px/1.2 var(--display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
svg.spark { width: 100%; height: 34px; display: block; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 8; background: rgba(0,0,0,.92); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) calc(6px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); }
.tabbar .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.tabbar button { appearance: none; border: 0; background: transparent; color: var(--dim); min-height: 52px; border-radius: 12px; cursor: pointer; display: grid; place-items: center; gap: 2px; padding: 4px 0; font: 600 10px/1 var(--display); letter-spacing: .12em; text-transform: uppercase; }
.tabbar button svg { width: 22px; height: 22px; }
.tabbar button[aria-current="page"] { color: var(--fg); background: var(--s2); }
.sheet { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.7); display: grid; align-items: end; justify-items: center; padding-top: calc(env(safe-area-inset-top, 0px) + 40px); }

.sheet .card .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar) + env(safe-area-inset-bottom, 0px) + 16px); z-index: 30; background: var(--s4); border: 1px solid var(--line2); border-radius: 999px; padding: 10px 16px; font-size: 14px; max-width: calc(100% - 32px); }
@media (min-width: 900px) {
  .screen { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .wide { grid-column: 1 / -1; }
  .tiles { grid-template-columns: repeat(4, minmax(0, 1fr)); }
}
@media (max-width: 360px) { form.grid, .formgrid, .out { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Quint HQ</div>
    <div class="clock" id="clock" aria-live="off"></div>
  </header>

  <!-- TODAY -->
  <section class="screen" id="tab-today" data-tab="today" aria-label="Today">
    <div class="panel hero wide">
      <canvas id="core" width="336" height="336" aria-hidden="true"></canvas>
      <p class="headline" id="headline"></p>
      <button class="btn" id="play" type="button" aria-pressed="false">Play briefing</button>
      <p class="small" id="voiceNote">Quint reads your briefing out loud.</p>
    </div>
    <div class="panel"><div class="label">Session <span class="r" id="sessR"></span></div><div id="session"></div></div>
    <div class="panel"><div class="label">News <span class="r">Lucid blackout ±2 min</span></div><div id="news"></div></div>
    <div class="panel wide"><div class="label">Money</div><div class="tiles" id="money"></div></div>
    <div class="panel"><div class="label">Before the open <span class="r" id="preR"></span></div><div class="checks" id="premarket"></div></div>
    <div class="panel"><div class="label">Last night</div><div class="list" id="lastNight"></div></div>
    <div class="panel wide"><details class="fold"><summary>The lab's roundup <span class="pill" id="warnCount"></span></summary><div class="body"><ol class="lines" id="lines"></ol><ul class="plain" id="warnings"></ul></div></details></div>
  </section>

  <!-- ASK -->
  <section class="screen ask" id="tab-ask" data-tab="ask" hidden aria-label="Ask Quint">
    <div class="panel wide">
      <div class="label">Ask Quint <span class="r" id="askState">offline</span></div>
      <div class="chat" id="chat" aria-live="polite"></div>
      <div class="chips" id="quick" style="margin-top:12px"></div>
      <form id="askForm" autocomplete="off" style="margin-top:12px">
        <input id="q" name="q" type="text" placeholder="How much room do I have on my 50K?" enterkeyhint="send" aria-label="Your question for Quint">
        <button class="ghost" id="mic" type="button" aria-label="Speak your question" aria-pressed="false" hidden><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2Z"/></svg></button>
        <button class="btn sm" type="submit">Ask</button>
      </form>
      <p class="small" id="askNote" style="margin-top:10px">On iPhone, tap the box and use the microphone on your keyboard to talk.</p>
      <div class="row2" style="margin-top:10px"><button class="ghost" id="clearChat" type="button">Clear chat</button></div>
    </div>
  </section>

  <!-- DESK -->
  <section class="screen" id="tab-desk" data-tab="desk" hidden aria-label="Desk">
    <div class="wide"><div class="seg" role="tablist" id="deskSeg"></div></div>
    <div class="wide screen" id="deskBody" style="padding-top:0"></div>
  </section>

  <!-- LAB -->
  <section class="screen" id="tab-lab" data-tab="lab" hidden aria-label="Lab">
    <div class="wide"><div class="seg" role="tablist" id="labSeg"></div></div>
    <div class="wide screen" id="labBody" style="padding-top:0"></div>
  </section>

  <!-- MORE -->
  <section class="screen" id="tab-more" data-tab="more" hidden aria-label="More"></section>
</div>

 1-minute MNQ. Until then, years-long tests happen in NinjaTrader.","cost":"Owner's choice","auto":false},{"id":"wyld-exact-rules","what":"Write WYLD Will's Four Pillars as exact rules a computer can test, following his videos: what counts as the easiest equal highs and lows on the 15m, how a level shows it holds, the stop buffer in ticks, the break-even trigger, and the cap on entries per PDR. You answer the gaps in Quint HQ or in chat. Then the Trading Mastery and Chart Wizard versions get lined up with these rules. Nothing is backtested until the rules are fixed.","cost":"None","auto":false}],"lessons":[{"date":"2026-11-19","lesson":"Replaying WYLD's rules exactly as the indicator reads them showed where setups die: the pools marked before the open were all run before 9:30, most sweeps found no higher-timeframe level holding nearby, and on 5-minute candles Point B came before any confirmation. A pillar can only be judged with the data it was designed for: 1-minute candles for the confirmation, and an exact rule for which pools count."},{"date":"2026-11-19","lesson":"Testing thousands of variations finds lucky winners easily: on the first night breakout and opening range scored PBO 60 to 67%, meaning their best variations were mostly luck. Only judge on unseen sessions, PBO, neighbours and the Lucid gate."},{"date":"2026-11-19","lesson":"The owner's strategy is WYLD Will's Four Pillars, the master version. Trading Mastery's six steps and Chart Wizard's 5 pillars are older codings of it, not separate strategies. Keep one entry and one checklist."},{"date":"2026-11-19","lesson":"The QQQ crypto stand-in on TraderDev flatters strategies. RSI(2) all-weather looked like about +$10,000 on 1 MNQ there and lost $2,345 on real MNQ (different months, so not a perfect comparison). Use the stand-in for quick ideas only; judge on real MNQ."},{"date":"2026-11-19","lesson":"TraderDev forces 0.05% commission a side and 100%-of-equity sizing whatever the script says, 20 to 30 times  0 trades in 4 weeks."}],"philosophy":["Many cheap, tight-stop attempts and a few large winners, not a high win rate.","Bias is immediate: the next move between two levels. Daily and weekly bias are left out.","Order matters more than location: the pillars must happen in sequence."],"window":{"startNY":"09:30","hours":3,"note":"Only the first 2 to 3 hours after the New York open (14:30 UK). Nothing after."},"premarket":["Redraw higher-timeframe levels from scratch: monthly, then weekly, then daily. About 95% of the time you stop at the daily.","Only mark levels near price. Drop any lower-timeframe level that overlaps a higher one. When in doubt, leave it out.","On the 15m, mark the easiest equal highs and lows nearest price. Note whether either side is already swept.","Draw the PDRs (Point A to Point B, with 25 / 50 / 75 steps) and mark the liquidity targets.","Set today's loss limit, and check the red-folder news times."],"checklist":[{"id":"sweep","name":"Liquidity sweep","check":"Price ran one of the 15m pools you marked before the open. A quick run of random lows doesn't count."},{"id":"level","name":"HTF level holds","check":"After the sweep, price traded into a higher-timeframe level and is showing it holds, not just touching it."},{"id":"pdr","name":"PDR bias","check":"Point A is the level that held, Point B the next HTF level. Holding sets the bias; above the 0.5 is stronger. Point B is the minimum target."},{"id":"confirm","name":"1m confirmation (the entry)","check":"A held level breaks and retests, price can't get back below the swept lows, a wick holds and price closes beyond it, an order block, or an FVG traded into or inverted."}],"entries":[{"name":"HTF retest, wait","trigger":"Price trades back into the level","entry":"Next candle","stop":"Below the level's test"},{"name":"HTF retest, intra-candle","trigger":"Price goes above the level, ticks back in and flips","entry":"At the tick","stop":"Below the wick low"},{"name":"HTF retest, immediate","trigger":"Close beyond the level, next candle retests (strong trends only)","entry":"On the retest","stop":"Below the prior candle's low, or 1 tick beyond the level"},{"name":"Wick at a level","trigger":"A wick prints at a level you expect to hold","entry":"50% of the wick","stop":"Below the wick low"},{"name":"FVG wick-through","trigger":"A candle wicks through the FVG and closes back beyond it","entry":"Retest near the 50% or the edge","stop":"Below the wick-through candle"},{"name":"FVG first touch","trigger":"Price reaches the FVG for the first time","entry":"Limit at the edge, 75% or 50%","stop":"Below candle 1 (safest), candle 2, or the FVG's wick"},{"name":"IFVG first test","trigger":"Price returns to a freshly inverted FVG","entry":"Anywhere in the zone","stop":"Beyond the candle that flipped it"},{"name":"Inversion wick","trigger":"Price closes beyond a small wick, flipping it","entry":"Wick edge, or 50% on the return","stop":"1 tick beyond the wick"},{"name":"OB, tick into mean threshold","trigger":"Price ticks back into the mean threshold before the OB is gained","entry":"At the mean threshold","stop":"Below the OB"},{"name":"OB retest after gain","trigger":"Price gains the OB, then comes back into it","entry":"On the return","stop":"Below the candle that tested the mean threshold"},{"name":"OB with FVG creation","trigger":"You expect an FVG to form at the OB (most aggressive)","entry":"OB open or high","stop":"1 tick below the wick; out if no FVG forms"}],"management":["Stop: tight, beyond the confirmation wick (above the wick or OB high for a short).","Break-even: as fast as possible once the level holds, and take it when it comes.","Target 1: Point B, the PDR completion. Target 2: the opposing liquidity pool. Trail near liquidity.","While the PDR is active, each new confirmation is a fresh entry, until Point B is reached or the PDR breaks."],"noTrade":["The marked 15m liquidity wasn't swept.","No HTF level involved (a rejection off a PDR level alone isn't a setup).","The next HTF level wasn't regained after the sweep.","A choppy day with no clean stage. Don't force it.","Shorting into support before the level has actually failed.","Outside the first 2 to 3 hours after the open.","The PDR is already fulfilled or broken."],"cautions":["His figures (about 70% break-even, 20% wins, 10% losses, 60R a month) are his own claims, not verified results.","Lucid flags an account when over half its profit comes from trades held 5 seconds or less. Hold winners well past that.","He never sets size, risk per trade or a daily loss limit. Use the Desk's sizing: a full stop-out under a quarter of the room left.","Not backtestable yet: 'easiest equal highs and lows', the stop buffer and the break-even trigger aren't defined exactly (lab queue: wyld-exact-rules)."]},"firm":{"firm":"Lucid Trading","plan":"LucidDaily","lastChecked":"2026-11-18","costs":{"commissionPerSide":{"MNQ":0.5},"slippageTicksPerSide":1},"sizes":[{"size":25000,"target":1250,"maxLoss":1000,"lockAt":26100,"lockFloor":25100,"dailyLoss":600,"maxMicros":20},{"size":50000,"target":3000,"maxLoss":2000,"lockAt":52100,"lockFloor":50100,"dailyLoss":1200,"maxMicros":40},{"size":100000,"target":6000,"maxLoss":3000,"lockAt":103100,"lockFloor":100100,"dailyLoss":1800,"maxMicros":60},{"size":150000,"target":9000,"maxLoss":4500,"lockAt":154600,"lockFloor":150100,"dailyLoss":2700,"maxMicros":100}]},"calendar":{"fetchedAt":null,"source":"TradingView economic calendar (US, high importance), written by the nightly run","events":[]},"roadmap":[{"stage":"Lab, scoreboard, Lucid simulator, paper test, spoken roundup","status":"Done"},{"stage":"Strategy factory: thousands of variations, judged on unseen data","status":"Done"},{"stage":"Quint HQ v2: Today, Ask, Desk, Lab, More, Trading Mastery sync, nightly controls","status":"Done"},{"stage":"WYLD indicator v2 on your chart, and the sequence analyst: what each pillar is worth, every night","status":"Done"},{"stage":"1-minute data and exact rules for your Four Pillars","status":"Next"},{"stage":"Years of data from NinjaTrader's Strategy Analyzer","status":"Needs your Windows computer"},{"stage":"Quint Control: engine, guardian, first bots on simulation","status":"Planned"},{"stage":"Live bots in the hub, copy trading across prop accounts","status":"Planned"},{"stage":"Ventures: other businesses on the same platform","status":"Later"}],"links":{"apps":[{"name":"Trading Mastery","what":"Your six-step model, signals, backtest lab and Jarvis","url":"https://claude.ai/artifact/4AhyMBBvRs9j4P3LKEmhnZ"},{"name":"Four Pillars Trainer","what":"Drill WYLD Will's Four Pillars","url":"https://claude.ai/artifact/SuUYodEDjKUqrdTAMBFWF1"},{"name":"WYLD Will System rulebook","what":"Your strategy's full rules","url":"https://claude.ai/artifact/KF6hmvDJWm3cPFbgxi3CKy"},{"name":"MNQ Intelligence Layer","what":"The signal and learning plan for Trading Mastery","url":"https://claude.ai/artifact/GPiurQUfktf67uXxV55Wwa"}],"repo":"https://github.com/charlieaustin1107/Quint","labCode":"https://github.com/charlieaustin1107/Quint/pull/17","nightlyChanges":"https://github.com/charlieaustin1107/Quint/pulls?q=is%3Apr+head%3Alab%2Fnightly","lucidRules":"https://support.lucidtrading.com/en/articles/15996664-luciddaily-evaluation"},"jobs":[{"name":"Quint Lab nightly run","when":"Weeknights 22:15 UK","what":"New candles, every bot, the strategy factory, the sequence analyst (what each pillar is worth), the paper test, your ideas, this page"},{"name":"Quint HQ sync","when":"Weeknights 23:25 UK","what":"Copies your Trading Mastery bot results, last night's Jarvis report and your pinned rules into this page's private storage"},{"name":"Jarvis nightly dream run","when":"Weeknights 22:40 UK","what":"Trading Mastery's own audit (yours, unchanged)"}]}</script>
<script>
(function () {
  'use strict';
  const D = JSON.parse(document.getElementById('lab-data').textContent);
  const $ = (id) => document.getElementById(id);

  // ---------- tiny helpers ----------
  function h(tag, attrs, ...kids) {
    const e = document.createElement(tag);
    if (attrs) for (const [k, v] of Object.entries(attrs)) {
      if (v === null || v === undefined || v === false) continue;
      if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
      else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else e.setAttribute(k, v === true ? '' : v);
    }
    for (const k of kids.flat()) if (k !== null && k !== undefined && k !== false) e.append(k.nodeType ? k : String(k));
    return e;
  }
  const clear = (el, ...kids) => { el.replaceChildren(...kids.flat().filter((x) => x !== null && x !== undefined && x !== false)); return el; };
  const money = (x) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : (x < 0 ? '-$' : '$') + Math.abs(Math.round(x)).toLocaleString('en-US'));
  const signed = (x) => (x === null || x === undefined || !Number.isFinite(x) ? '—' : (x < 0 ? '-$' : '+$') + Math.abs(Math.round(x)).toLocaleString('en-US'));
  const pct = (x) => (x === null || x === undefined || !Number.isFinite(x) ? 'n/a' : Math.round(x * 100) + '%');
  const tone = (x) => (x > 0 ? 'up' : x < 0 ? 'down' : '');
  const say = (x) => (x < 0 ? 'minus ' : '') + '$' + Math.abs(Math.round(x)).toLocaleString('en-US');
  const LS = {
    get(k, d) { try { const v = localStorage.getItem('hq.' + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem('hq.' + k, JSON.stringify(v)); } catch (e) { /* storage off: fine */ } },
  };
  let toastT = 0;
  function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 2600); }

  // ---------- time: UK and New York ----------
  const fmtParts = (tz) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', weekday: 'short', hourCycle: 'h23' });
  const NYF = fmtParts('America/New_York'), UKF = fmtParts('Europe/London');
  const DOW = { Sun: 0, Mon: 1, Tue: 2, Wed: 3, Thu: 4, Fri: 5, Sat: 6 };
  function parts(f, date) { const p = Object.fromEntries(f.formatToParts(date).map((x) => [x.type, x.value])); return { date: `${p.year}-${p.month}-${p.day}`, hh: p.hour, mm: p.minute, dow: DOW[p.weekday], min: Number(p.hour) * 60 + Number(p.minute) }; }
  const ukTime = (date) => { const p = parts(UKF, date); return `${p.hh}:${p.mm}`; };
  const dur = (m) => { m = Math.max(0, Math.round(m)); const hh = Math.floor(m / 60), mm = m % 60; return hh ? `${hh}h ${String(mm).padStart(2, '0')}m` : `${mm}m`; };
  const todayUK = () => parts(UKF, new Date()).date;

  function session(now) {
    const ny = parts(NYF, now), W = Math.round((S.settings.windowHours || 3) * 60), open = 570, end = open + W;
    const weekday = ny.dow >= 1 && ny.dow <= 5;
    let daysAhead = 0;
    if (!(weekday && ny.min < open)) daysAhead = ny.dow === 5 ? 3 : ny.dow === 6 ? 2 : 1;
    const minsToOpen = daysAhead * 1440 - ny.min + open, nextOpen = new Date(now.getTime() + minsToOpen * 60000);
    const o = { ny, inWindow: false, minsToOpen, nextOpenUK: ukTime(nextOpen), windowEndUK: ukTime(new Date(nextOpen.getTime() + W * 60000)), progress: 0 };
    if (ny.dow === 6 || (ny.dow === 0 && ny.min < 1080) || (ny.dow === 5 && ny.min >= 1020)) return { ...o, state: 'weekend', title: 'Weekend', text: `Futures reopen Sunday evening. New York opens Monday at ${o.nextOpenUK} UK.` };
    if (weekday && ny.min >= open && ny.min < end) {
      const nowEnd = new Date(now.getTime() + (end - ny.min) * 60000);
      return { ...o, state: 'window', inWindow: true, progress: (ny.min - open) / W, title: 'Your trading window', text: `${dur(end - ny.min)} left, until ${ukTime(nowEnd)} UK. Four Pillars only.` };
    }
    if (weekday && ny.min >= end && ny.min < 960) return { ...o, state: 'late', title: 'Window closed', text: `Your ${W / 60}-hour window is over. New York cash closes at ${ukTime(new Date(now.getTime() + (960 - ny.min) * 60000))} UK.` };
    if (weekday && ny.min >= 1020 && ny.min < 1080) return { ...o, state: 'break', title: 'Daily break', text: 'CME futures are closed for an hour. They reopen at 18:00 New York.' };
    return { ...o, state: 'pre', title: ny.min >= 960 ? 'After hours' : 'Pre-market', text: `New York opens in ${dur(minsToOpen)}, at ${o.nextOpenUK} UK. Mark your levels first.` };
  }

  function news(now) {
    const ev = ((D.calendar && D.calendar.events) || []).map((e) => ({ ...e, at: new Date(e.t) })).filter((e) => !isNaN(e.at)).sort((a, b) => a.at - b.at);
    const blackout = ev.find((e) => Math.abs(e.at - now) <= 2 * 60000);
    const next = ev.find((e) => e.at - now > -2 * 60000);
    return { blackout, next, loaded: !!(D.calendar && D.calendar.fetchedAt), fetchedAt: D.calendar && D.calendar.fetchedAt };
  }

  // ---------- storage: private by default; on this device when storage isn't available ----------
  const Store = {
    db: null, uid: null, mode: 'device',
    async init() {
      try {
        const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
        if (db && user) { const id = await withTimeout(user.id(), 8000); if (id) { this.db = db; this.uid = id; this.mode = 'cloud'; } }
      } catch (e) { /* stays on the device */ }
    },
    col(kind) { return kind === 'ideas' ? this.db.collection('ideas') : this.db.collection(`data/users/${this.uid}/desk/${kind}`); },
    async list(kind) {
      if (this.mode !== 'cloud') return LS.get('col.' + kind, []);
      const snap = await withTimeout(this.col(kind).get(), 10000);
      return snap.docs.map((d) => ({ ...d.data(), id: d.id }));
    },
    async save(kind, obj) {
      const data = JSON.parse(JSON.stringify({ ...obj, id: undefined }));
      if (this.mode !== 'cloud') {
        const all = LS.get('col.' + kind, []), id = obj.id || Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
        const i = all.findIndex((x) => x.id === id);
        if (i >= 0) all[i] = { ...data, id }; else all.push({ ...data, id });
        LS.set('col.' + kind, all); return id;
      }
      if (obj.id) { await withTimeout(this.col(kind).doc(obj.id).set(data), 10000); return obj.id; }
      const ref = await withTimeout(this.col(kind).add(data), 10000); return ref.id;
    },
    async remove(kind, id) {
      if (this.mode !== 'cloud') { LS.set('col.' + kind, LS.get('col.' + kind, []).filter((x) => x.id !== id)); return; }
      await withTimeout(this.col(kind).doc(id).delete(), 10000);
    },
    async getDoc(name, d) {
      if (this.mode !== 'cloud') return LS.get('doc.' + name, d);
      const s = await withTimeout(this.db.doc(`data/users/${this.uid}/${name}`).get(), 10000);
      return s.exists ? { ...d, ...s.data() } : d;
    },
    async setDoc(name, v) {
      if (this.mode !== 'cloud') { LS.set('doc.' + name, v); return; }
      await withTimeout(this.db.doc(`data/users/${this.uid}/${name}`).set(JSON.parse(JSON.stringify(v))), 10000);
    },
    async feed() {
      if (this.mode !== 'cloud') return null;
      const s = await withTimeout(this.db.doc('feeds/tm').get(), 10000);
      return s.exists ? s.data() : null;
    },
  };
  function withTimeout(p, ms) { return Promise.race([p, new Promise((_, no) => setTimeout(() => no({ code: 'timeout', message: 'took too long' }), ms))]); }

  // ---------- state ----------
  const DEFAULTS = { windowHours: 3, riskShare: 0.25, voice: true, rate: 1.02, tvPlan: 10 };
  const S = { settings: { ...DEFAULTS, ...LS.get('settings', {}) }, accounts: [], trades: [], ideas: [], day: { premarket: {}, pillars: {} }, feed: null, tab: 'today', desk: 'check', lab: 'factory' };

  // ---------- prop maths (Lucid rules, every number editable) ----------
  const RT_COST = 2; // per MNQ round trip: $0.50 a side commission plus 1 tick slippage each way
  function acct(a) {
    const start = +a.start || +a.size || 0, balance = +a.balance || start, high = Math.max(+a.eodHigh || start, start);
    const floor = high >= +a.lockAt ? +a.lockFloor : high - (+a.maxLoss || 0);
    const room = balance - floor, profit = balance - start;
    const todayTrades = S.trades.filter((t) => t.account === a.id && t.date === todayUK());
    const today = todayTrades.reduce((s, t) => s + (+t.pnl || 0), 0);
    const dllLeft = a.dllOn ? (+a.dll || 0) + Math.min(0, today) : null;
    const best = +a.bestDay || 0, share = profit > 0 && best > 0 ? best / profit : null;
    let maxRisk = Math.max(0, room * (S.settings.riskShare || 0.25));
    if (dllLeft !== null) maxRisk = Math.min(maxRisk, Math.max(0, dllLeft));
    return { start, balance, high, floor, room, profit, today, dllLeft, share, consistencyOk: share === null || share <= (+a.consistency || 0.4),
      toTarget: a.phase === 'funded' ? null : start + (+a.target || 0) - balance, progress: a.phase === 'funded' || !+a.target ? null : Math.max(0, Math.min(1, profit / +a.target)), maxRisk };
  }
  function sizeFor(a, stopPts) {
    const m = acct(a), per = stopPts * 2 + RT_COST;
    const contracts = stopPts > 0 ? Math.max(0, Math.min(+a.maxMicros || 40, Math.floor(m.maxRisk / per))) : 0;
    return { contracts, risk: contracts * per, roomAfter: m.room - contracts * per, maxRisk: m.maxRisk, room: m.room };
  }
  function tightest() { return S.accounts.map((a) => ({ a, m: acct(a) })).sort((x, y) => x.m.room - y.m.room)[0] || null; }

  // ---------- journal ----------
  function weekStart(dateStr) { const d = new Date(dateStr + 'T12:00:00Z'), dow = (d.getUTCDay() + 6) % 7; d.setUTCDate(d.getUTCDate() - dow); return d.toISOString().slice(0, 10); }
  function jstats(list) {
    const t = todayUK(), wk = weekStart(t), mo = t.slice(0, 7);

      ...[['Priorities', d.priorities], ['Health', d.health], ['Risk', d.risk], ['Learning', d.learning]].filter(([, v]) => v && v.length).map(([k, v]) => h('div', null, h('div', { class: 'label', text: k }), h('ul', { class: 'plain' }, v.map((x) => h('li', { text: x }))))),
      f.rules && f.rules.length ? h('div', null, h('div', { class: 'label', text: 'Your pinned rules' }), h('ul', { class: 'plain' }, f.rules.map((r) => h('li', null, h('b', { style: 'color:var(--fg);font-weight:500', text: r.title + ': ' }), r.text)))) : null]);
  }

  // ---------- ASK (Jarvis) ----------
  let sample = null, dict = null, listening = false, chat = LS.get('chat', []);
  const RULES = 'You are Quint, a calm Jarvis for a UK trader who trades MNQ (Micro Nasdaq futures, $2 a point) from an iPhone and is working to pass and keep Lucid Trading prop accounts. Their strategy is WYLD Will\'s Four Pillars (sweep, HTF level holds, PDR bias, 1-minute confirmation), traded in the first 3 hours after the New York open (14:30 UK). Answer in plain British English, in 2 to 5 short sentences that read well aloud. Use the tools to look things up; never guess numbers. Say where a number comes from and when data is thin (under 100 trades is an anecdote). Never call a strategy profitable or proven, never tell the owner to take or skip a specific trade, and never place or suggest placing orders: only the owner decides. If they ask you to add or test an idea, use add_idea. Nothing is financial advice.';
  function ctxLine() { const now = new Date(), s = session(now), uk = parts(UKF, now); return `Now: ${uk.date} ${uk.hh}:${uk.mm} UK. ${s.title}: ${s.text}`; }
  const TOOLS = [
    { name: 'get_overview', description: 'Today at a glance: session, next news, money (bots from Trading Mastery, the owner\'s own trades, the paper test), prop room, lab headline and warnings.',
      execute: () => { const now = new Date(), n = news(now), tg = tightest(); return { session: session(now), nextNews: n.next ? { title: n.next.title, ukTime: ukTime(n.next.at) } : null, newsLoaded: n.loaded, bots: botsLive(), myTrades: jstats(S.trades), paper: D.roundup.paper, tightestAccount: tg ? { name: tg.a.name, room: tg.m.room, maxRisk: tg.m.maxRisk } : null, labHeadline: D.roundup.headline, warnings: D.roundup.warnings }; } },
    { name: 'get_lab', description: 'The bot scoreboard (backtests on saved MNQ candles, 1 MNQ after costs), the strategy factory results (variations, survivors, PBO by family), and the sequence analyst: what each WYLD pillar is worth (the funnel, each pillar with and without, each confirmation alone, why trades won or lost, proposed experiments).',
      execute: () => ({ bots: D.bots.map((b) => ({ name: b.name, trades: b.trades, net: Math.round(b.net), laterHalf: Math.round(b.laterHalf), maxDrawdown: Math.round(b.maxDrawdown), grade: b.grade, lucidPass: b.pass, lucidFail: b.fail, paperTrades: b.forward.trades, paperNet: Math.round(b.forward.net) })), factory: D.factory && { variants: D.factory.variants, asOf: D.factory.asOf, readyForPaper: D.factory.readyForPaper, families: D.factory.families.map((f) => ({ name: f.name, variants: f.variants, pbo: f.pbo, survivors: (f.survivors || []).length, verdict: f.verdict })) }, pillars: D.anatomy && { asOf: D.anatomy.asOf, candles: D.anatomy.candles, sessions: D.anatomy.sessions, lessons: D.anatomy.lessons, pillars: D.anatomy.pillars, confirmations: D.anatomy.confirmations, whyTradesWonOrLost: D.anatomy.study, proposals: D.anatomy.proposals } }) },
    { name: 'find_strategy', description: 'Look up one strategy in Quint\'s memory by name or keyword: status, rules, verdict, evidence and next step.', inputSchema: { type: 'object', properties: { query: { type: 'string' } }, required: ['query'] },
      execute: ({ query }) => { const q = String(query || '').toLowerCase(); const hits = D.strategies.filter((s) => (s.name + ' ' + s.id + ' ' + (s.rules || '')).toLowerCase().includes(q)).slice(0, 3); return hits.length ? hits : { none: 'No strategy matches. Try another word.' }; } },
    { name: 'get_my_strategy', description: 'The owner\'s strategy, WYLD Will\'s Four Pillars: the checklist, pre-market routine, entries, stops and targets, no-trade rules and cautions.', execute: () => D.playbook },
    { name: 'get_accounts', description: 'The owner\'s prop accounts: balance, floor, room left before the max loss, distance to target, consistency, daily loss limit left and max risk per trade.',
      execute: () => S.accounts.length ? S.accounts.map((a) => { const m = acct(a); return { name: a.name, plan: a.plan, size: a.size, stage: a.phase, balance: m.balance, floor: m.floor, room: Math.round(m.room), toTarget: m.toTarget, consistencyShare: m.share, consistencyOk: m.consistencyOk, dailyLimitLeft: m.dllLeft, maxRiskPerTrade: Math.round(m.maxRisk), today: m.today }; }) : { none: 'No accounts added yet. They go on the Desk.' } },
    { name: 'get_journal', description: 'The owner\'s logged trades: P&L today, this week, this month and all time, win rate, average win and loss, and results by setup.', execute: () => ({ ...jstats(S.trades), recent: [...S.trades].sort((a, b) => (b.date || '').localeCompare(a.date || '')).slice(0, 10) }) },
    { name: 'size_trade', description: 'How many MNQ a stop of a given number of points allows on an account, keeping a full stop-out under the owner\'s share of the room left (a quarter by default).', inputSchema: { type: 'object', properties: { stop_points: { type: 'number' }, account: { type: 'string', description: 'Account name; the tightest account if left out' } }, required: ['stop_points'] },
      execute: ({ stop_points, account }) => { const a = (account && S.accounts.find((x) => x.name.toLowerCase().includes(String(account).toLowerCase()))) || (tightest() || {}).a; if (!a) return { none: 'No accounts added yet.' }; return { account: a.name, stopPoints: stop_points, ...sizeFor(a, +stop_points) }; } },
    { name: 'get_trading_mastery', description: 'From Trading Mastery, synced nightly: last night\'s Jarvis dream report, the NinjaTrader bots\' results by account type (live, sim, playback, backtest), and the owner\'s pinned rules.', execute: () => S.feed || { none: 'Not synced yet. The HQ sync runs weeknights at 23:25 UK.' } },
    { name: 'add_idea', description: 'Save an idea to the lab\'s inbox; the nightly run writes its exact rules, tests it and reports back. Use only when the owner asks to add, save or test an idea.', inputSchema: { type: 'object', properties: { text: { type: 'string' }, kind: { type: 'string', enum: ['strategy', 'rule', 'feature', 'venture'] } }, required: ['text'] },
      execute: async ({ text, kind }) => { const id = await addIdea(String(text), kind); return { saved: true, id, where: Store.mode === 'cloud' ? 'the lab inbox (the nightly run reads it)' : 'this device only' }; } },
  ];
  function renderAsk() {
    clear($('chat'), chat.length ? chat.map((m) => h('div', { class: 'msg ' + (m.who === 'you' ? 'you' : 'quint') + (m.err ? ' err' : ''), text: m.text })) : h('div', { class: 'msg quint', text: 'Ask me anything about your day, your accounts, your bots, the lab or your Four Pillars. I can also add an idea to the lab for you.' }));
    $('askState').textContent = sample ? 'online' : 'offline';
  }
  async function ask(question) {
    question = String(question || '').trim();
    if (!question) return;
    $('q').value = '';
    chat.push({ who: 'you', text: question });
    const pending = { who: 'quint', text: sample ? 'Thinking…' : '' };
    chat.push(pending); renderAsk();
    const node = $('chat').lastElementChild;
    if (!sample) { pending.text = 'Asking Quint works when this page is open in Claude. Everything else here still works.'; pending.err = true; renderAsk(); return; }
    const earlier = chat.slice(-12, -2).filter((m) => !m.err).map((m) => `${m.who === 'you' ? 'Owner' : 'Quint'}: ${m.text}`).join('\n');
    const prompt = `${RULES}\n\n${ctxLine()}${earlier ? '\n\nCONVERSATION SO FAR:\n' + earlier : ''}\n\nOWNER: ${question}`;
    try {
      const r = await sample(prompt, { tools: TOOLS, onText: ({ text }) => { if (node) node.textContent = text; }, cache: false, modelTier: 'default' });
      pending.text = r.text; renderAsk();
      speak([r.text]);
    } catch (e) {
      pending.err = true;
      pending.text = e && e.code === 'not_granted' ? 'Quint needs your OK to answer here. Allow it in this page\'s permissions.' : e && e.code === 'rate_limited' ? 'Quint is busy. Try again in a minute.' : 'Quint couldn\'t answer just now. Try again in a moment.';
      renderAsk();
    }
    chat = chat.slice(-40); LS.set('chat', chat);
  }
  $('askForm').addEventListener('submit', (e) => { e.preventDefault(); ask($('q').value); });
  $('clearChat').addEventListener('click', () => { chat = []; LS.set('chat', chat); renderAsk(); });
  clear($('quick'), ['Brief me for today', 'How much room do I have?', 'How did my bots do?', 'What did the factory find?', 'What is each pillar worth?', 'Walk me through the four pillars', 'Add an idea to the lab'].map((q) => h('button', { class: 'chip', type: 'button', onclick: () => ask(q), text: q })));
  $('mic').addEventListener('click', () => {
    if (!dict) return;
    if (listening) { dict.stop().catch(() => {}); return; }
    $('q').value = '';
    dict.start().catch((e) => { if (e && e.code === 'not_granted') $('mic').hidden = true; });
  });

  // ---------- sheets, tabs, routing ----------
  let lastFocus = null;
  function sheet(title, kids) {
    lastFocus = document.activeElement;
    clear($('sheetCard'), h('div', { class: 'head' }, h('h2', { id: 'sheetTitle', text: title }), h('button', { class: 'ghost', type: 'button', 'aria-label': 'Close', onclick: closeSheet, text: '✕' })), kids);
    $('sheet').hidden = false;
    const f = $('sheetCard').querySelector('input,select,textarea,button'); if (f) f.focus();
  }
  function closeSheet() { $('sheet').hidden = true; if (lastFocus && lastFocus.focus) lastFocus.focus(); }
  $('sheet').addEventListener('click', (e) => { if (e.target === $('sheet')) closeSheet(); });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !$('sheet').hidden) closeSheet(); });
  const ICONS = {
    today: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    ask: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    desk: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18V9M10 18V5M16 18v-6M22 18H2" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>',
    lab: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 2 3h10a2 2 0 0 0 2-3l-5-9V3" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>',
    more: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.8" fill="currentColor"/><circle cx="12" cy="12" r="1.8" fill="currentColor"/><circle cx="19" cy="12" r="1.8" fill="currentColor"/></svg>',
  };
  const TABS = [['today', 'Today'], ['ask', 'Ask'], ['desk', 'Desk'], ['lab', 'Lab'], ['more', 'More']];
  clear($('tabs'), TABS.map(([id, label]) => { const b = h('button', { type: 'button', 'data-tab': id, onclick: () => go(id) }); b.innerHTML = ICONS[id]; b.append(h('span', { text: label })); return b; }));
  function go(tab, sub) {
    if (sub && tab === 'lab') S.lab = sub;
    if (sub && tab === 'desk') S.desk = sub;
    S.tab = tab;
    if (location.hash !== '#' + tab) { try { history.replaceState(null, '', '#' + tab); } catch (e) { /* fine */ } }
    render(); window.scrollTo(0, 0);
  }
  window.addEventListener('hashchange', () => { const t = location.hash.slice(1); if (TABS.some(([id]) => id === t) && t !== S.tab) go(t); });
  function render() {
    for (const [id] of TABS) { $('tab-' + id).hidden = id !== S.tab; }
    for (const b of $('tabs').children) b.setAttribute('aria-current', b.dataset.tab === S.tab ? 'page' : 'false');
    renderClock();
    if (S.tab === 'today') { renderToday(); startLoop(); } else stopLoop();
    if (S.tab === 'ask') renderAsk();
    if (S.tab === 'desk') renderDesk();
    if (S.tab === 'lab') renderLab();
    if (S.tab === 'more') renderMore();
  }
  async function reload(kind) {
    try { S[kind] = await Store.list(kind); } catch (e) { toast('Couldn\'t load your ' + kind + '. Showing what this screen has.'); }
    render();
  }

  $('play').addEventListener('click', () => {
    if (speaking) return stopSpeaking();
    const lines = briefing();
    S.lines = lines;
    clear($('lines'), lines.map((t) => h('li', { text: t })));
    const fold = $('lines').closest('details'); if (fold) fold.open = true;
    speak(lines, markLine);
  });

  // ---------- start: draw first, then light features up as capabilities arrive ----------
  const start = location.hash.slice(1);
  if (TABS.some(([id]) => id === start)) S.tab = start;
  drawCore(performance.now());
  render();
  setInterval(() => { renderClock(); if (S.tab === 'today' && !document.hidden) { const s = session(new Date()); $('sessR').textContent = s.inWindow ? 'live' : ''; } }, 30000);
  document.addEventListener('visibilitychange', () => (document.hidden ? stopLoop() : startLoop()));
  if (window.speechSynthesis && speechSynthesis.onvoiceschanged !== undefined) speechSynthesis.onvoiceschanged = () => {};
  if (window.claude && typeof window.claude.use === 'function') {
    (async () => {
      await Store.init();
      try {
        const [acc, tr, id, st, day, feed] = await Promise.all([Store.list('accounts'), Store.list('trades'), Store.list('ideas'), Store.getDoc('settings', {}), Store.getDoc('day-' + todayUK(), { premarket: {}, pillars: {} }), Store.feed().catch(() => null)]);
        S.accounts = acc; S.trades = tr; S.ideas = id; S.settings = { ...S.settings, ...st }; S.day = { premarket: {}, pillars: {}, ...day }; S.feed = feed;
      } catch (e) { toast('Your saved data didn\'t load. Try reopening the page.'); }
      render();
    })();
    claude.use('sample').then((s) => { sample = s; if (s) $('askNote').textContent = 'Quint looks things up in your accounts, journal, the lab and Trading Mastery. On iPhone, use your keyboard\'s microphone to talk.'; render(); }).catch(() => {});
    claude.use('tts').then((t) => { if (!t) return; tts = t; $('voiceNote').textContent = 'Quint reads your briefing out loud in a Claude voice.'; t.onState(({ state }) => { if (state === 'idle') setSpeaking(false); }); if (t.onLine) t.onLine(({ id }) => markLine(Number(id))); }).catch(() => {});
    claude.use('dictation').then((d) => {
      if (!d) return;
      dict = d; $('mic').hidden = false; $('askNote').textContent = 'Tap the microphone, ask, then tap it again.';
      d.onPartial(({ text }) => { $('q').value = text; });
      d.onFinal(({ text }) => { $('q').value = text; });
      d.onState(({ state }) => { listening = state === 'listening'; $('mic').setAttribute('aria-pressed', listening ? 'true' : 'false'); if (!listening && $('q').value.trim()) ask($('q').value); });
    }).catch(() => {});
    claude.use('mcp').then((m) => { mcp = m; }).catch(() => {});
    claude.use('downloads').then((d) => { downloads = d; }).catch(() => {});
  } else {
    // Outside Claude: everything still works, saved on this device.
    S.accounts = LS.get('col.accounts', []); S.trades = LS.get('col.trades', []); S.ideas = LS.get('col.ideas', []); S.day = { premarket: {}, pillars: {}, ...LS.get('doc.day-' + todayUK(), {}) };
    render();
  }
  window.__HQ = { S, acct, sizeFor, session, news, jstats, briefing, Store, TOOLS, findBars };
})();
</script>
