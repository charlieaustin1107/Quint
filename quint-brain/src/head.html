<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quint Brain</title>
<meta name="theme-color" content="#02040a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Quint: a neural cockpit for one market. Electric-blue wiring on deep navy glass; mint for buys, rose for sells.
     Layout: instruments on top (price tape, the five-point core, the session tape), the conversation below; side by side on a wide screen. */
  --void: #02040a;
  --glass: #070c18;
  --glass2: #0b1528;
  --line: #17263b;
  --line2: #22364f;
  --ink: #dce6f3;
  --dim: #7a8ea8;
  --faint: #4a5d76;
  --amber: #29d8ff;
  --amber2: #a6efff;
  --buy: #2fd9a8;
  --sell: #ff4f6e;
  --warn: #ffb547;
  --violet: #9b6bff;
  --f-display: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Martian Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--buy); } .neg { color: var(--sell); } .wrn { color: var(--warn); }

#app { position: fixed; left: 0; right: 0; top: 0; height: var(--vvh, 100%); display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: radial-gradient(900px 420px at 80% -8%, rgba(41,216,255,.10), transparent 62%), radial-gradient(700px 500px at -10% 110%, rgba(47,217,168,.05), transparent 60%), var(--void); }
#app::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35; background-image: linear-gradient(rgba(122,142,168,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(122,142,168,.07) 1px, transparent 1px); background-size: 28px 28px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 55%); mask-image: linear-gradient(180deg, #000, transparent 55%); }

/* top bar */
.bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 4px 14px; border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: center; gap: 8px; font: 700 18px/1 var(--f-display); letter-spacing: .32em; text-transform: uppercase; color: var(--amber); text-shadow: 0 0 14px rgba(41,216,255,.45); }
.mark svg { flex: none; }
.mkt { position: relative; display: flex; align-items: center; }
.mkt select { appearance: none; -webkit-appearance: none; min-height: 34px; padding: 0 26px 0 10px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); font: 600 14px/1 var(--f-display); letter-spacing: .08em; color: var(--ink); }
.mkt::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 1.5px solid var(--dim); border-bottom: 1.5px solid var(--dim); transform: rotate(45deg); pointer-events: none; }
.spacer { flex: 1; }
.stat { display: flex; align-items: center; gap: 6px; font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.stat i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.stat.on i { background: var(--buy); box-shadow: 0 0 8px var(--buy); } .stat.off i { background: var(--sell); } .stat.wait i { background: var(--warn); }
.ibtn { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); color: var(--dim); }
.ibtn:hover { color: var(--amber); border-color: rgba(41,216,255,.5); }

.cols { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.inst { flex: none; display: flex; flex-direction: column; min-height: 0; }
.talk { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#app:not([data-view="console"]) .inst { flex: 1; }
#app:not([data-view="console"]) .talk { flex: none; }
#app:not([data-view="console"]) .log { display: none; }
#app[data-view="console"] .side { display: none; }

/* instrument deck */
.deck { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0; height: 228px; border-bottom: 1px solid var(--line); }
.tapebox { position: relative; border-right: 1px solid var(--line); }
#tape, #core { display: block; width: 100%; height: 100%; }
.corebox { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.corebox canvas { position: absolute; inset: 0; }
.verdict { position: relative; text-align: center; pointer-events: none; padding: 7px 10px; border-radius: 4px; background: rgba(3,8,18,.78); box-shadow: 0 0 18px rgba(3,8,18,.9); }
.verdict b { display: block; font: 700 22px/1 var(--f-display); letter-spacing: .18em; color: var(--amber); text-shadow: 0 0 18px rgba(41,216,255,.5); }
.verdict.buy b { color: var(--buy); text-shadow: 0 0 18px rgba(47,217,168,.55); } .verdict.sell b { color: var(--sell); text-shadow: 0 0 18px rgba(255,79,110,.55); }
.verdict small { display: block; max-width: 118px; margin: 6px auto 0; font: 500 10px/1.3 var(--f-num); color: var(--dim); letter-spacing: .04em; }
.deckfoot { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; justify-content: space-between; font: 500 9.5px/1 var(--f-num); color: var(--faint); pointer-events: none; }
.dmin { display: none; align-items: center; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
.dmin .px { font: 700 18px/1 var(--f-num); } .dmin .vd { font: 700 12px/1 var(--f-display); letter-spacing: .16em; }
#app.typing .deck, #app.typing .strip { display: none; } #app.typing .dmin { display: flex; }
#app[data-view="brain"] .deck, #app[data-view="brain"] .strip { display: none; } #app[data-view="brain"] .dmin { display: flex; }
.side.bv { padding: 0; overflow: hidden; }
.brainbox { position: relative; flex: 1; min-height: 0; background: radial-gradient(120% 80% at 50% 45%, #10082a, #02030a 72%); }
#brain { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; cursor: grab; }
#brain:active { cursor: grabbing; } #brain:focus-visible { outline-offset: -3px; }
.feed { position: absolute; left: 0; right: 0; bottom: 0; height: 26px; overflow: hidden; border-top: 1px solid rgba(160,120,255,.35); background: linear-gradient(90deg, rgba(20,8,40,.85), rgba(6,10,30,.85)); font: 600 10.5px/26px var(--f-num); letter-spacing: .08em; color: #c9b8ff; white-space: nowrap; }
.feed span { display: inline-block; padding-left: 100%; animation: feed 38s linear infinite; } @keyframes feed { to { transform: translateX(-100%); } }
@media (prefers-reduced-motion: reduce) { .feed span { animation: none; padding-left: 12px; } }
.bhint { position: absolute; left: 12px; bottom: 34px; margin: 0; font: 500 10px/1 var(--f-num); color: var(--faint); pointer-events: none; }
.binfo { position: absolute; left: 12px; right: 12px; bottom: 52px; display: flex; flex-direction: column; gap: 4px; padding: 12px 44px 12px 14px; border: 1px solid rgba(41,216,255,.55); border-radius: 4px; background: rgba(3,10,22,.94); box-shadow: 0 0 30px rgba(41,216,255,.18); }
.binfo[hidden] { display: none; } .binfo b { font: 700 13px/1.2 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--amber2); } .binfo span { font-size: 13px; color: var(--ink); } .binfo .btn { align-self: flex-start; margin-top: 6px; } .binfo .ibtn { position: absolute; top: 8px; right: 8px; width: 30px; height: 30px; }

/* session tape */
.strip { position: relative; height: 40px; border-bottom: 1px solid var(--line); overflow: hidden; }
#sess { display: block; width: 100%; height: 100%; }

/* segmented view switch */
.seg { flex: none; display: grid; grid-template-columns: repeat(5, 1fr); border-bottom: 1px solid var(--line); }
.seg button { position: relative; min-height: 40px; border: 0; background: transparent; font: 600 11px/1 var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--dim); }
.seg button[aria-pressed="true"] { color: var(--amber); }
.seg button[aria-pressed="true"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 2px; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.seg button .n { margin-left: 5px; color: var(--ink); letter-spacing: 0; }

.side { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 14px; }

/* panels */
.h { margin: 0 0 8px; font: 600 11px/1 var(--f-display); letter-spacing: .24em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.h .spacer { flex: 1; }
.read { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink); text-wrap: pretty; }
.read b { color: var(--amber2); font-weight: 600; }
table.mx { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.mx th { text-align: left; font: 600 10px/1 var(--f-display); letter-spacing: .16em; color: var(--faint); text-transform: uppercase; padding: 0 6px 7px 0; border-bottom: 1px solid var(--line); }
table.mx td { padding: 8px 6px 8px 0; border-bottom: 1px solid var(--line); font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.mx td:first-child { font: 700 12px/1 var(--f-display); letter-spacing: .1em; color: var(--ink); }
.tr { display: inline-flex; align-items: center; gap: 4px; font: 700 11px/1 var(--f-display); letter-spacing: .12em; }
.tr.up { color: var(--buy); } .tr.dn { color: var(--sell); } .tr.fl { color: var(--dim); }
.rsi { display: inline-block; width: 34px; height: 4px; margin-left: 6px; vertical-align: middle; background: var(--line2); position: relative; border-radius: 2px; }
.rsi i { position: absolute; top: -2px; width: 2px; height: 8px; background: var(--amber); }
.lv { display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 12px; align-items: baseline; font-size: 12.5px; }
.lv > span { padding: 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lv .k { font: 700 11px/1 var(--f-display); letter-spacing: .12em; padding-top: 7px; }
.lv .t { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.lv .p, .lv .d { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.lv .now { color: var(--amber); }
.xm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.xm div { padding: 8px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); }
.xm small { display: block; font: 600 9.5px/1 var(--f-display); letter-spacing: .16em; color: var(--faint); text-transform: uppercase; }
.xm b { display: block; margin-top: 5px; font: 600 13px/1 var(--f-num); }
#scope { display: block; width: 100%; height: 190px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); }
.tfs { display: flex; gap: 4px; }
.tfs button { min-height: 28px; padding: 0 9px; border-radius: 3px; border: 1px solid var(--line2); background: transparent; font: 600 10.5px/1 var(--f-num); color: var(--dim); }
.tfs button[aria-pressed="true"] { color: var(--void); background: var(--amber); border-color: var(--amber); }
.ev { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.ev div { display: flex; gap: 10px; align-items: baseline; } .ev .tm { font: 500 11.5px/1 var(--f-num); color: var(--dim); width: 74px; flex: none; } .ev .hi { color: var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tiles div { padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); }
.tiles small { display: block; font: 600 9.5px/1 var(--f-display); letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
.tiles b { display: block; margin-top: 7px; font: 700 20px/1 var(--f-num); }
.cal { position: relative; height: 10px; border-radius: 2px; background: var(--line); }
.cal i { position: absolute; top: -3px; width: 2px; height: 16px; }
.cal .a { background: var(--ink); } .cal .s { background: var(--amber); }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.row .w { font: 500 11px/1.3 var(--f-num); color: var(--dim); }
.row .r { font: 600 11.5px/1 var(--f-display); letter-spacing: .08em; text-align: right; }
.st-win { color: var(--buy); } .st-loss { color: var(--sell); } .st-time { color: var(--warn); } .st-live { color: var(--amber); }
.small { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: 0; }
.note { padding: 11px 12px; border-left: 2px solid var(--amber); background: rgba(41,216,255,.05); }
.note ol { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.al { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.al span { flex: 1; min-width: 0; } .al b { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; } .al small { display: block; font-size: 11.5px; color: var(--dim); }
.al.off { opacity: .55; }
.btn { min-height: 38px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); font: 600 12px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.btn:hover { border-color: rgba(41,216,255,.55); color: var(--amber2); }
.btn.pri { border-color: var(--amber); background: var(--amber); color: #021422; }
.btn.pri:hover { background: var(--amber2); color: #021422; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 11px; }
.err { margin: 0; padding: 10px 12px; border-left: 2px solid var(--sell); background: rgba(255,79,110,.07); font-size: 13px; }

/* the conversation */
.m { max-width: 680px; }
.m.u { align-self: flex-end; max-width: 86%; padding: 9px 13px; border: 1px solid var(--line2); border-radius: 12px 12px 2px 12px; background: var(--glass2); font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.m.a { position: relative; padding-left: 16px; border-left: 1px solid rgba(41,216,255,.35); font-size: 14.5px; }
.m.a::before { content: "Q"; position: absolute; left: -8px; top: 0; width: 15px; height: 15px; display: grid; place-items: center; font: 700 9px/1 var(--f-display); color: var(--void); background: var(--amber); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
.m.a p { margin: 0 0 8px; } .m.a h3, .m.a h4 { margin: 12px 0 6px; font: 600 11px/1 var(--f-display); letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
.m.a ul, .m.a ol { margin: 0 0 8px; padding-left: 18px; } .m.a li { margin: 3px 0; }
.m.a b, .m.a strong { color: #fff; font-weight: 600; }
.m.a code { font: 12px var(--f-num); padding: 1px 4px; border-radius: 3px; background: var(--glass2); }
.m.a pre { overflow-x: auto; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); font: 11.5px/1.5 var(--f-num); }
.m.a table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; } .m.a th, .m.a td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.think { display: flex; align-items: center; gap: 8px; margin: 0; font: 500 12px/1.3 var(--f-num); color: var(--amber); }
.think::before { content: ""; width: 10px; height: 10px; border: 1.5px solid var(--amber); border-right-color: transparent; border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chipb { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 3px; border: 1px solid var(--line2); background: transparent; font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.chipb:hover { color: var(--amber2); border-color: rgba(41,216,255,.5); }
.chipb.on, .chipb.on:disabled { color: var(--warn); border-color: rgba(255,209,102,.55); background: rgba(255,209,102,.07); opacity: 1; }
.xbtn { display: block; width: 100%; margin-top: 8px; padding: 10px 12px; text-align: left; border-radius: 4px; border: 1px dashed rgba(41,216,255,.45); background: rgba(41,216,255,.04); font-size: 13px; color: var(--amber2); }
.xbtn.on, .xbtn.on:disabled { border-style: solid; color: var(--warn); opacity: 1; }
.hello { padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: linear-gradient(135deg, rgba(41,216,255,.07), transparent 60%), var(--glass); }
.hello > b { display: block; font: 700 13px/1.2 var(--f-display); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
.hello p { margin: 0; font-size: 14px; color: var(--ink); }

/* a trade call */
.call { margin-top: 10px; position: relative; padding: 13px 14px 12px; border: 1px solid var(--line2); border-radius: 4px; background: var(--glass); overflow: hidden; }
.call::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--amber); }
.call.buy::before { background: var(--buy); box-shadow: 0 0 14px var(--buy); } .call.sell::before { background: var(--sell); box-shadow: 0 0 14px var(--sell); }
.call.buy { background: linear-gradient(100deg, rgba(47,217,168,.08), transparent 55%), var(--glass); } .call.sell { background: linear-gradient(100deg, rgba(255,79,110,.08), transparent 55%), var(--glass); }
.ch { display: flex; align-items: center; gap: 12px; }
.ch .v { flex: 1; font: 700 17px/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; }
.call.buy .ch .v { color: var(--buy); } .call.sell .ch .v { color: var(--sell); } .call.none .ch .v { color: var(--warn); }
.ring { --p: 50; flex: none; position: relative; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--amber) calc(var(--p) * 1%), var(--line2) 0); }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--glass); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 12px/1 var(--f-num); color: var(--ink); }
.lvls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-top: 12px; background: var(--line); border: 1px solid var(--line); }
.lvls div { padding: 8px 9px; background: var(--glass2); min-width: 0; }
.lvls small { display: block; font: 600 9.5px/1 var(--f-display); letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
.lvls b { display: block; margin-top: 6px; font: 700 14px/1 var(--f-num); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.lvls em { display: block; margin-top: 4px; font: normal 500 10.5px/1 var(--f-num); color: var(--dim); }
.cmeta { margin: 10px 0 0; font-size: 12.5px; color: var(--dim); }
.cmeta b { color: var(--ink); font-weight: 600; }
.cw { margin: 6px 0 0; font-size: 12.5px; color: var(--warn); }
.cst { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font: 600 10.5px/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
.cst::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.cst.win { color: var(--buy); } .cst.loss { color: var(--sell); } .cst.time, .cst.nofill, .cst.skip, .cst.bad, .cst.nodata { color: var(--dim); }

/* quick asks and the input */
.chips { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 32px; padding: 0 11px; border-radius: 3px; border: 1px solid var(--line2); background: rgba(8,16,28,.7); font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.chips button:hover { color: var(--amber2); border-color: rgba(41,216,255,.5); }
.ask { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 14px 10px; }
.ask textarea { flex: 1; min-height: 44px; max-height: 120px; resize: none; padding: 11px 13px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass); font-size: 16px; line-height: 1.35; color: var(--ink); }
.ask textarea::placeholder { color: var(--faint); }
.ask textarea:focus { outline: none; border-color: rgba(41,216,255,.7); box-shadow: 0 0 0 3px rgba(41,216,255,.12); }
.ask .ibtn { width: 44px; height: 44px; } .ask .go { width: 44px; height: 44px; border-radius: 4px; border: 0; background: var(--amber); color: #021422; display: grid; place-items: center; box-shadow: 0 0 18px rgba(41,216,255,.35); }
.ask .go.stop { background: var(--sell); color: #fff; box-shadow: none; }
.prev { flex: none; display: flex; align-items: center; gap: 10px; margin: 0 14px; padding: 7px 10px; border: 1px dashed rgba(41,216,255,.45); border-radius: 4px; font-size: 12.5px; color: var(--amber2); }
.prev span { flex: 1; }

/* settings sheet */
.scrim { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(2,4,8,.72); }
.scrim.open { display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; overflow-y: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(41,216,255,.5); background: var(--glass); display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { margin: 0; font: 700 14px/1 var(--f-display); letter-spacing: .26em; text-transform: uppercase; color: var(--amber); display: flex; align-items: center; }
.sheet h2 .spacer { flex: 1; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label, .fld .lab { font: 600 10.5px/1 var(--f-display); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.fld input[type="text"], .fld input[type="number"], .fld select { min-height: 42px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); font-size: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opts button { min-height: 36px; padding: 0 12px; border-radius: 3px; border: 1px solid var(--line2); background: transparent; font: 600 11px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.opts button[aria-pressed="true"] { color: #021422; background: var(--amber); border-color: var(--amber); }
.voices { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; max-height: 230px; overflow-y: auto; }
.voices button { display: flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 12px; border: 0; border-bottom: 1px solid var(--line); background: transparent; text-align: left; font-size: 14px; }
.voices button:last-child { border-bottom: 0; }
.voices button span { flex: 1; } .voices button small { color: var(--faint); font: 500 10.5px var(--f-num); }
.voices button[aria-pressed="true"] { background: rgba(41,216,255,.09); color: var(--amber2); }
.tog { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; text-align: left; font-size: 14px; }
.tog .k { flex: none; position: relative; width: 42px; height: 24px; border-radius: 12px; background: var(--line2); transition: background .2s; }
.tog .k::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.tog[aria-pressed="true"] .k { background: var(--amber); } .tog[aria-pressed="true"] .k::after { transform: translateX(18px); background: #021422; }
input[type="range"] { width: 100%; accent-color: var(--amber); }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); z-index: 30; transform: translate(-50%, 12px); max-width: min(92vw, 520px); padding: 10px 14px; border: 1px solid rgba(41,216,255,.5); border-radius: 4px; background: rgba(8,16,28,.96); font-size: 13px; color: var(--ink); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 520px) { .mark { font-size: 15px; letter-spacing: .2em; gap: 6px; } .mkt select { max-width: 132px; font-size: 13px; padding-right: 22px; } .bar { gap: 8px; padding: 4px 10px; } .stat span { display: none; } .stat { padding: 6px; } }
@media (min-width: 900px) {
  .cols { display: grid; grid-template-columns: 420px minmax(0, 1fr); }
  .inst { border-right: 1px solid var(--line); min-height: 0; }
  #app .inst, #app:not([data-view="console"]) .inst { flex: none; }
  #app .side, #app[data-view="console"] .side { display: flex; }
  #app .log, #app:not([data-view="console"]) .log { display: flex; }
  .seg { grid-template-columns: repeat(4, 1fr); } .seg [data-v="console"] { display: none; }
  #app[data-view="brain"] .deck, #app[data-view="brain"] .strip { display: grid; } #app[data-view="brain"] .strip { display: block; } #app[data-view="brain"] .dmin { display: none; }
  .deck { height: 250px; }
  .log, .chips, .ask { width: 100%; max-width: 860px; margin: 0 auto; }
  .prev { width: calc(100% - 28px); max-width: 832px; margin: 0 auto; }
}
@media (prefers-reduced-motion: reduce) { .think::before { animation: none; } .toast { transition: none; } }
.m.a .now { margin: 0 0 8px; padding: 7px 10px 7px 26px; position: relative; border: 1px solid rgba(41,216,255,.35); background: rgba(41,216,255,.07); border-radius: 8px; font: 500 12px/1.45 var(--f-num); color: #cfeaff; font-variant-numeric: tabular-nums; }
.m.a .now::before { content: ""; position: absolute; left: 10px; top: 12px; width: 7px; height: 7px; border-radius: 50%; background: var(--buy, #3ee08f); box-shadow: 0 0 8px var(--buy, #3ee08f); }
.rf { display: inline-flex; align-items: center; gap: 4px; min-height: 36px; min-width: 40px; padding: 0 8px; border: 1px solid var(--line2); border-radius: 3px; background: transparent; color: var(--ink); font: 600 10.5px/1 var(--f-num); }
.rf.old { color: var(--warn, #ffb347); border-color: rgba(255,179,71,.5); } .rf:disabled { opacity: .55; } .rf:active { transform: scale(.96); }
.pil { margin-top: 14px; } .pil h4 { margin: 0 0 6px; font: 700 10.5px/1.2 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.pil ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; } .pil li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: start; font-size: 12.5px; line-height: 1.4; }
.pil li b { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 50%; font: 700 11px/1 var(--f-num); border: 1px solid var(--line2); color: var(--dim); } .pil li.ok b { background: var(--buy); border-color: var(--buy); color: #02140d; }
.pil .pv { margin-top: 8px; font-size: 12.5px; } .pil .pv.ok { color: var(--buy); }

/* ================= NEON HUD: matches Chart Wizard ================= */
.bar { background: linear-gradient(180deg, rgba(5,10,22,.92), rgba(3,6,14,.8)); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.bar::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: linear-gradient(90deg, transparent, var(--amber), var(--violet), transparent); box-shadow: 0 0 10px var(--amber); }
.mark { background: linear-gradient(90deg, #e6fbff, var(--amber) 45%, var(--violet)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.mark svg { color: var(--amber); filter: drop-shadow(0 0 6px rgba(41,216,255,.7)); }
.seg button[aria-pressed="true"]::after { background: linear-gradient(90deg, var(--amber), var(--violet)); }
.call, .hello, .tiles div, .xm div, .lvls div { position: relative; }
.call::after, .hello::after { content: ""; position: absolute; inset: -1px; pointer-events: none; border-radius: inherit;
  background: linear-gradient(var(--amber), var(--amber)) 100% 0 / 14px 2px no-repeat, linear-gradient(var(--amber), var(--amber)) 100% 0 / 2px 14px no-repeat,
    linear-gradient(var(--violet), var(--violet)) 100% 100% / 14px 2px no-repeat, linear-gradient(var(--violet), var(--violet)) 100% 100% / 2px 14px no-repeat; opacity: .75; }
.call { box-shadow: 0 0 0 1px rgba(41,216,255,.06), 0 18px 40px -28px rgba(41,216,255,.6); }
.ring { background: conic-gradient(var(--amber), var(--violet) calc(var(--p) * 1%), var(--line2) 0); }
.chips button, .chipb, .btn, .opts button { border-color: rgba(41,216,255,.2); }
.chips button:hover, .chipb:hover, .btn:hover { box-shadow: 0 0 16px -4px rgba(41,216,255,.7); }
.btn.pri, .ask .go { background: linear-gradient(135deg, var(--amber), var(--violet)); border-color: transparent; color: #01131c; }
.m.u { background: linear-gradient(135deg, rgba(41,216,255,.14), rgba(155,107,255,.2)); border-color: rgba(155,107,255,.45); }
.ask textarea { border-radius: 22px; background: rgba(4,8,18,.85); }
.sheet { box-shadow: 0 -10px 40px rgba(41,216,255,.12); }

/* voice mode */
.ask .mic[aria-pressed="true"] { color: #01131c; background: linear-gradient(135deg, var(--amber), var(--violet)); border-color: transparent; box-shadow: 0 0 16px -2px rgba(41,216,255,.8); }
.ask .mic.live { animation: vmpulse 1.2s ease-in-out infinite; }
@keyframes vmpulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(41,216,255,.7); } 50% { box-shadow: 0 0 0 10px rgba(41,216,255,0); } }
.vmbar { flex: none; display: flex; align-items: center; gap: 10px; margin: 6px 14px 0; padding: 8px 10px; border: 1px solid rgba(41,216,255,.4); border-radius: 4px; background: linear-gradient(90deg, rgba(41,216,255,.08), rgba(155,107,255,.1)); font: 500 12.5px/1.35 var(--f-num); color: var(--amber2); }
.vmbar .vmt { flex: 1; min-width: 0; }
.vmbar .vmorb { flex: none; width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--amber); box-shadow: 0 0 12px var(--amber); }
.vmbar.listen .vmorb, .vmbar.speak .vmorb { animation: vmpulse 1s ease-in-out infinite; } .vmbar.think .vmorb { border-color: var(--violet); }
@media (prefers-reduced-motion: reduce) { .ask .mic.live, .vmbar .vmorb { animation: none !important; } }
@media (min-width: 900px) { .vmbar { width: calc(100% - 28px); max-width: 832px; margin: 6px auto 0; } }

/* 3D core + sound settings */
.vmbar .vmorb.has3d { position: relative; border: 0; box-shadow: none; animation: none; } canvas.qcore { position: absolute; left: -35%; top: -35%; width: 170%; height: 170%; pointer-events: none; }
.fxset { display: flex; flex-direction: column; gap: 10px; } .fxset .small { margin: 0; }
.lgtog { display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0; border: 0; background: transparent; text-align: left; font-size: 14px; color: var(--ink); }
.lgtog .k { flex: none; position: relative; width: 42px; height: 24px; border-radius: 12px; background: var(--line2); }
.lgtog .k::after { content: ""; position: absolute; left: 3px; top: 3px; width: 18px; height: 18px; border-radius: 50%; background: var(--ink); transition: transform .2s; }
.lgtog[aria-pressed="true"] .k { background: var(--amber); } .lgtog[aria-pressed="true"] .k::after { transform: translateX(18px); background: #021422; }

.vsteps { margin: 6px 0 8px; padding-left: 20px; display: flex; flex-direction: column; gap: 5px; font-size: 13px; line-height: 1.45; } .vsteps b { color: var(--amber2); font-weight: 600; }
#vnote p { margin: 0 0 6px; } #vnote { color: var(--ink); }
</style>
</head>
<body>
<div id="app" data-view="brain">
  <header class="bar">
    <div class="mark" aria-label="Quint"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><polygon points="10,1.5 18.5,7.7 15.3,17.6 4.7,17.6 1.5,7.7" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="10" cy="10.6" r="2.4" fill="currentColor"/></svg>Quint</div>
    <label class="mkt"><span class="sr">Market</span><select id="mk" aria-label="Market Quint is watching"></select></label>
    <span class="spacer"></span>
    <span class="stat" id="stat"><i></i><span>Connecting</span></span>
    <button class="rf" id="rf" type="button" aria-label="Refresh the price from TradingView"><svg width="15" height="15" viewBox="0 0 20 20" aria-hidden="true"><path d="M16 10a6 6 0 1 1-1.8-4.3M16 3.5v3.6h-3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="rfa"></span></button>
    <button class="ibtn" id="setb" type="button" aria-label="Settings: account, risk, style and voice"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><circle cx="10" cy="10" r="2.6" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10 1.8v2.6M10 15.6v2.6M1.8 10h2.6M15.6 10h2.6M4.2 4.2l1.8 1.8M14 14l1.8 1.8M4.2 15.8 6 14M14 6l1.8-1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
  </header>
  <div class="cols">
    <aside class="inst" aria-label="Instruments">
      <section class="deck" aria-label="Price tape and Quint's verdict">
        <div class="tapebox"><canvas id="tape" role="img" aria-label="Price tape: the latest price in the middle with the session's key levels above and below"></canvas></div>
        <div class="corebox"><canvas id="core" aria-hidden="true"></canvas><div class="verdict" id="vd" aria-live="polite"><b>Scanning</b><small>Reading the market</small></div><div class="deckfoot"><span id="dkl"></span><span id="dkr"></span></div></div>
      </section>
      <div class="dmin" id="dmin" aria-hidden="true"><span class="px num" id="dminp"></span><span class="vd" id="dminv"></span></div>
      <div class="strip"><canvas id="sess" role="img" aria-label="Session clock"></canvas></div>
      <nav class="seg" aria-label="Views">
        <button type="button" data-v="brain" aria-pressed="true">Brain</button>
        <button type="button" data-v="console" aria-pressed="false">Console</button>
        <button type="button" data-v="matrix" aria-pressed="false">Matrix</button>
        <button type="button" data-v="record" aria-pressed="false">Record</button>
        <button type="button" data-v="alerts" aria-pressed="false">Alerts</button>
      </nav>
      <div class="side" id="side" aria-live="polite"></div>
    </aside>
    <section class="talk" aria-label="Talk to Quint">
      <div class="log" id="log" aria-live="polite"></div>
      <div class="chips" id="chips" role="group" aria-label="Quick questions"></div>
      <form class="ask" id="askf">
        <label class="ibtn" for="file" aria-label="Send Quint a screenshot of your chart"><svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 6.5h3l1.5-2h5L14 6.5h3v9.5H3z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="10" cy="11" r="3" fill="none" stroke="currentColor" stroke-width="1.5"/></svg><input type="file" id="file" accept="image/*" hidden></label>
        <button class="ibtn mic" id="mic" type="button" aria-label="Voice mode: talk to Quint" aria-pressed="false"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M4.5 9.5a5.5 5.5 0 0 0 11 0M10 15v2.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
        <textarea id="q" rows="1" placeholder="Ask Quint: buy or sell MNQ?" aria-label="Message Quint" enterkeyhint="send"></textarea>
        <button class="go" id="go" type="submit" aria-label="Send"><svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h12M10 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      </form>
    </section>
  </div>
</div>
<div class="scrim" id="scrim" role="dialog" aria-modal="true" aria-labelledby="sheth"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
