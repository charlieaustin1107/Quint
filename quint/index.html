<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quint</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=Martian+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Quint: a cockpit for one market. Amber phosphor instruments on deep navy glass; mint for buys, rose for sells.
     Layout: instruments on top (price tape, the five-point core, the session tape), the conversation below; side by side on a wide screen. */
  --void: #03060b;
  --glass: #08101c;
  --glass2: #0c1626;
  --line: #17263b;
  --line2: #22364f;
  --ink: #dce6f3;
  --dim: #7a8ea8;
  --faint: #4a5d76;
  --amber: #ffb547;
  --amber2: #ffd38a;
  --buy: #3ef0b0;
  --sell: #ff5c7a;
  --warn: #ffd166;
  --f-display: "Chakra Petch", "Rajdhani", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-num: "Martian Mono", "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); font: 15px/1.5 var(--f-body); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
body { overflow: hidden; }
button, select, textarea, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.pos { color: var(--buy); } .neg { color: var(--sell); } .wrn { color: var(--warn); }

#app { position: fixed; left: 0; right: 0; top: 0; height: var(--vvh, 100%); display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: radial-gradient(900px 420px at 80% -8%, rgba(255,181,71,.10), transparent 62%), radial-gradient(700px 500px at -10% 110%, rgba(62,240,176,.05), transparent 60%), var(--void); }
#app::before { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: .35; background-image: linear-gradient(rgba(122,142,168,.07) 1px, transparent 1px), linear-gradient(90deg, rgba(122,142,168,.07) 1px, transparent 1px); background-size: 28px 28px; -webkit-mask-image: linear-gradient(180deg, #000, transparent 55%); mask-image: linear-gradient(180deg, #000, transparent 55%); }

/* top bar */
.bar { position: relative; z-index: 2; display: flex; align-items: center; gap: 10px; min-height: 50px; padding: 4px 14px; border-bottom: 1px solid var(--line); }
.mark { display: flex; align-items: center; gap: 8px; font: 700 18px/1 var(--f-display); letter-spacing: .32em; text-transform: uppercase; color: var(--amber); text-shadow: 0 0 14px rgba(255,181,71,.45); }
.mark svg { flex: none; }
.mkt { position: relative; display: flex; align-items: center; }
.mkt select { appearance: none; -webkit-appearance: none; min-height: 34px; padding: 0 26px 0 10px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); font: 600 14px/1 var(--f-display); letter-spacing: .08em; color: var(--ink); }
.mkt::after { content: ""; position: absolute; right: 10px; top: 50%; width: 6px; height: 6px; margin-top: -5px; border-right: 1.5px solid var(--dim); border-bottom: 1.5px solid var(--dim); transform: rotate(45deg); pointer-events: none; }
.spacer { flex: 1; }
.stat { display: flex; align-items: center; gap: 6px; font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); white-space: nowrap; }
.stat i { width: 7px; height: 7px; border-radius: 50%; background: var(--faint); }
.stat.on i { background: var(--buy); box-shadow: 0 0 8px var(--buy); } .stat.off i { background: var(--sell); } .stat.wait i { background: var(--warn); }
.ibtn { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); color: var(--dim); }
.ibtn:hover { color: var(--amber); border-color: rgba(255,181,71,.5); }

.cols { position: relative; z-index: 1; flex: 1; min-height: 0; display: flex; flex-direction: column; }
.inst { flex: none; display: flex; flex-direction: column; min-height: 0; }
.talk { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#app:not([data-view="console"]) .inst { flex: 1; }
#app:not([data-view="console"]) .talk { flex: none; }
#app:not([data-view="console"]) .log { display: none; }
#app[data-view="console"] .side { display: none; }

/* instrument deck */
.deck { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 0; height: 228px; border-bottom: 1px solid var(--line); }
.tapebox { position: relative; border-right: 1px solid var(--line); }
#tape, #core { display: block; width: 100%; height: 100%; }
.corebox { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.corebox canvas { position: absolute; inset: 0; }
.verdict { position: relative; text-align: center; pointer-events: none; }
.verdict b { display: block; font: 700 22px/1 var(--f-display); letter-spacing: .18em; color: var(--amber); text-shadow: 0 0 18px rgba(255,181,71,.5); }
.verdict.buy b { color: var(--buy); text-shadow: 0 0 18px rgba(62,240,176,.55); } .verdict.sell b { color: var(--sell); text-shadow: 0 0 18px rgba(255,92,122,.55); }
.verdict small { display: block; max-width: 118px; margin: 6px auto 0; font: 500 10px/1.3 var(--f-num); color: var(--dim); letter-spacing: .04em; }
.deckfoot { position: absolute; left: 8px; right: 8px; bottom: 6px; display: flex; justify-content: space-between; font: 500 9.5px/1 var(--f-num); color: var(--faint); pointer-events: none; }
.dmin { display: none; align-items: center; gap: 10px; padding: 6px 14px; border-bottom: 1px solid var(--line); }
.dmin .px { font: 700 18px/1 var(--f-num); } .dmin .vd { font: 700 12px/1 var(--f-display); letter-spacing: .16em; }
#app.typing .deck, #app.typing .strip { display: none; } #app.typing .dmin { display: flex; }

/* session tape */
.strip { position: relative; height: 40px; border-bottom: 1px solid var(--line); overflow: hidden; }
#sess { display: block; width: 100%; height: 100%; }

/* segmented view switch */
.seg { flex: none; display: grid; grid-template-columns: repeat(4, 1fr); border-bottom: 1px solid var(--line); }
.seg button { position: relative; min-height: 40px; border: 0; background: transparent; font: 600 11.5px/1 var(--f-display); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
.seg button[aria-pressed="true"] { color: var(--amber); }
.seg button[aria-pressed="true"]::after { content: ""; position: absolute; left: 22%; right: 22%; bottom: -1px; height: 2px; background: var(--amber); box-shadow: 0 0 10px var(--amber); }
.seg button .n { margin-left: 5px; color: var(--ink); letter-spacing: 0; }

.side { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 16px; }
.log { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; padding: 14px 16px 10px; display: flex; flex-direction: column; gap: 14px; }

/* panels */
.h { margin: 0 0 8px; font: 600 11px/1 var(--f-display); letter-spacing: .24em; text-transform: uppercase; color: var(--dim); display: flex; align-items: center; gap: 8px; }
.h .spacer { flex: 1; }
.read { margin: 0; font-size: 15px; line-height: 1.55; color: var(--ink); text-wrap: pretty; }
.read b { color: var(--amber2); font-weight: 600; }
table.mx { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.mx th { text-align: left; font: 600 10px/1 var(--f-display); letter-spacing: .16em; color: var(--faint); text-transform: uppercase; padding: 0 6px 7px 0; border-bottom: 1px solid var(--line); }
table.mx td { padding: 8px 6px 8px 0; border-bottom: 1px solid var(--line); font-family: var(--f-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.mx td:first-child { font: 700 12px/1 var(--f-display); letter-spacing: .1em; color: var(--ink); }
.tr { display: inline-flex; align-items: center; gap: 4px; font: 700 11px/1 var(--f-display); letter-spacing: .12em; }
.tr.up { color: var(--buy); } .tr.dn { color: var(--sell); } .tr.fl { color: var(--dim); }
.rsi { display: inline-block; width: 34px; height: 4px; margin-left: 6px; vertical-align: middle; background: var(--line2); position: relative; border-radius: 2px; }
.rsi i { position: absolute; top: -2px; width: 2px; height: 8px; background: var(--amber); }
.lv { display: grid; grid-template-columns: auto 1fr auto auto; gap: 4px 12px; align-items: baseline; font-size: 12.5px; }
.lv > span { padding: 5px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
.lv .k { font: 700 11px/1 var(--f-display); letter-spacing: .12em; padding-top: 7px; }
.lv .t { color: var(--dim); overflow: hidden; text-overflow: ellipsis; }
.lv .p, .lv .d { font-family: var(--f-num); font-variant-numeric: tabular-nums; text-align: right; }
.lv .now { color: var(--amber); }
.xm { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.xm div { padding: 8px 9px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); }
.xm small { display: block; font: 600 9.5px/1 var(--f-display); letter-spacing: .16em; color: var(--faint); text-transform: uppercase; }
.xm b { display: block; margin-top: 5px; font: 600 13px/1 var(--f-num); }
#scope { display: block; width: 100%; height: 190px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); }
.tfs { display: flex; gap: 4px; }
.tfs button { min-height: 28px; padding: 0 9px; border-radius: 3px; border: 1px solid var(--line2); background: transparent; font: 600 10.5px/1 var(--f-num); color: var(--dim); }
.tfs button[aria-pressed="true"] { color: var(--void); background: var(--amber); border-color: var(--amber); }
.ev { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.ev div { display: flex; gap: 10px; align-items: baseline; } .ev .tm { font: 500 11.5px/1 var(--f-num); color: var(--dim); width: 74px; flex: none; } .ev .hi { color: var(--warn); }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.tiles div { padding: 11px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); }
.tiles small { display: block; font: 600 9.5px/1 var(--f-display); letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
.tiles b { display: block; margin-top: 7px; font: 700 20px/1 var(--f-num); }
.cal { position: relative; height: 10px; border-radius: 2px; background: var(--line); }
.cal i { position: absolute; top: -3px; width: 2px; height: 16px; }
.cal .a { background: var(--ink); } .cal .s { background: var(--amber); }
.rows { display: flex; flex-direction: column; }
.row { display: grid; grid-template-columns: 70px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.row .w { font: 500 11px/1.3 var(--f-num); color: var(--dim); }
.row .r { font: 600 11.5px/1 var(--f-display); letter-spacing: .08em; text-align: right; }
.st-win { color: var(--buy); } .st-loss { color: var(--sell); } .st-time { color: var(--warn); } .st-live { color: var(--amber); }
.small { font-size: 12.5px; color: var(--dim); line-height: 1.5; margin: 0; }
.note { padding: 11px 12px; border-left: 2px solid var(--amber); background: rgba(255,181,71,.05); }
.note ol { margin: 6px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
.al { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
.al span { flex: 1; min-width: 0; } .al b { display: block; font-size: 13px; font-weight: 600; overflow-wrap: anywhere; } .al small { display: block; font-size: 11.5px; color: var(--dim); }
.al.off { opacity: .55; }
.btn { min-height: 38px; padding: 0 14px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); font: 600 12px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); }
.btn:hover { border-color: rgba(255,181,71,.55); color: var(--amber2); }
.btn.pri { border-color: var(--amber); background: var(--amber); color: #1b1203; }
.btn.pri:hover { background: var(--amber2); color: #1b1203; }
.btn:disabled { opacity: .5; cursor: default; }
.btn.sm { min-height: 32px; padding: 0 11px; font-size: 11px; }
.err { margin: 0; padding: 10px 12px; border-left: 2px solid var(--sell); background: rgba(255,92,122,.07); font-size: 13px; }

/* the conversation */
.m { max-width: 680px; }
.m.u { align-self: flex-end; max-width: 86%; padding: 9px 13px; border: 1px solid var(--line2); border-radius: 12px 12px 2px 12px; background: var(--glass2); font-size: 14.5px; white-space: pre-wrap; overflow-wrap: anywhere; }
.m.a { position: relative; padding-left: 16px; border-left: 1px solid rgba(255,181,71,.35); font-size: 14.5px; }
.m.a::before { content: "Q"; position: absolute; left: -8px; top: 0; width: 15px; height: 15px; display: grid; place-items: center; font: 700 9px/1 var(--f-display); color: var(--void); background: var(--amber); clip-path: polygon(50% 0, 100% 38%, 82% 100%, 18% 100%, 0 38%); }
.m.a p { margin: 0 0 8px; } .m.a h3, .m.a h4 { margin: 12px 0 6px; font: 600 11px/1 var(--f-display); letter-spacing: .22em; text-transform: uppercase; color: var(--amber); }
.m.a ul, .m.a ol { margin: 0 0 8px; padding-left: 18px; } .m.a li { margin: 3px 0; }
.m.a b, .m.a strong { color: #fff; font-weight: 600; }
.m.a code { font: 12px var(--f-num); padding: 1px 4px; border-radius: 3px; background: var(--glass2); }
.m.a pre { overflow-x: auto; padding: 10px; border: 1px solid var(--line); border-radius: 4px; background: var(--glass); font: 11.5px/1.5 var(--f-num); }
.m.a table { border-collapse: collapse; font-size: 12.5px; display: block; overflow-x: auto; } .m.a th, .m.a td { padding: 4px 8px; border-bottom: 1px solid var(--line); text-align: left; }
.think { display: flex; align-items: center; gap: 8px; margin: 0; font: 500 12px/1.3 var(--f-num); color: var(--amber); }
.think::before { content: ""; width: 10px; height: 10px; border: 1.5px solid var(--amber); border-right-color: transparent; border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.acts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chipb { display: inline-flex; align-items: center; gap: 6px; min-height: 30px; padding: 0 10px; border-radius: 3px; border: 1px solid var(--line2); background: transparent; font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.chipb:hover { color: var(--amber2); border-color: rgba(255,181,71,.5); }
.chipb.on, .chipb.on:disabled { color: var(--warn); border-color: rgba(255,209,102,.55); background: rgba(255,209,102,.07); opacity: 1; }
.xbtn { display: block; width: 100%; margin-top: 8px; padding: 10px 12px; text-align: left; border-radius: 4px; border: 1px dashed rgba(255,181,71,.45); background: rgba(255,181,71,.04); font-size: 13px; color: var(--amber2); }
.xbtn.on, .xbtn.on:disabled { border-style: solid; color: var(--warn); opacity: 1; }
.hello { padding: 14px 16px; border: 1px solid var(--line); border-radius: 4px; background: linear-gradient(135deg, rgba(255,181,71,.07), transparent 60%), var(--glass); }
.hello > b { display: block; font: 700 13px/1.2 var(--f-display); letter-spacing: .2em; text-transform: uppercase; color: var(--amber); margin-bottom: 8px; }
.hello p { margin: 0; font-size: 14px; color: var(--ink); }

/* a trade call */
.call { margin-top: 10px; position: relative; padding: 13px 14px 12px; border: 1px solid var(--line2); border-radius: 4px; background: var(--glass); overflow: hidden; }
.call::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--amber); }
.call.buy::before { background: var(--buy); box-shadow: 0 0 14px var(--buy); } .call.sell::before { background: var(--sell); box-shadow: 0 0 14px var(--sell); }
.call.buy { background: linear-gradient(100deg, rgba(62,240,176,.08), transparent 55%), var(--glass); } .call.sell { background: linear-gradient(100deg, rgba(255,92,122,.08), transparent 55%), var(--glass); }
.ch { display: flex; align-items: center; gap: 12px; }
.ch .v { flex: 1; font: 700 17px/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; }
.call.buy .ch .v { color: var(--buy); } .call.sell .ch .v { color: var(--sell); } .call.none .ch .v { color: var(--warn); }
.ring { --p: 50; flex: none; position: relative; width: 46px; height: 46px; border-radius: 50%; background: conic-gradient(var(--amber) calc(var(--p) * 1%), var(--line2) 0); }
.ring::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; background: var(--glass); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font: 700 12px/1 var(--f-num); color: var(--ink); }
.lvls { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; margin-top: 12px; background: var(--line); border: 1px solid var(--line); }
.lvls div { padding: 8px 9px; background: var(--glass2); min-width: 0; }
.lvls small { display: block; font: 600 9.5px/1 var(--f-display); letter-spacing: .18em; color: var(--faint); text-transform: uppercase; }
.lvls b { display: block; margin-top: 6px; font: 700 14px/1 var(--f-num); font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; }
.lvls em { display: block; margin-top: 4px; font: normal 500 10.5px/1 var(--f-num); color: var(--dim); }
.cmeta { margin: 10px 0 0; font-size: 12.5px; color: var(--dim); }
.cmeta b { color: var(--ink); font-weight: 600; }
.cw { margin: 6px 0 0; font-size: 12.5px; color: var(--warn); }
.cst { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font: 600 10.5px/1 var(--f-display); letter-spacing: .16em; text-transform: uppercase; color: var(--amber); }
.cst::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 8px currentColor; }
.cst.win { color: var(--buy); } .cst.loss { color: var(--sell); } .cst.time, .cst.nofill, .cst.skip, .cst.bad, .cst.nodata { color: var(--dim); }

/* quick asks and the input */
.chips { flex: none; display: flex; gap: 6px; overflow-x: auto; padding: 8px 14px 2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chips::-webkit-scrollbar { display: none; }
.chips button { flex: none; min-height: 32px; padding: 0 11px; border-radius: 3px; border: 1px solid var(--line2); background: rgba(8,16,28,.7); font: 600 10.5px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.chips button:hover { color: var(--amber2); border-color: rgba(255,181,71,.5); }
.ask { flex: none; display: flex; align-items: flex-end; gap: 8px; padding: 8px 14px 10px; }
.ask textarea { flex: 1; min-height: 44px; max-height: 120px; resize: none; padding: 11px 13px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass); font-size: 16px; line-height: 1.35; color: var(--ink); }
.ask textarea::placeholder { color: var(--faint); }
.ask textarea:focus { outline: none; border-color: rgba(255,181,71,.7); box-shadow: 0 0 0 3px rgba(255,181,71,.12); }
.ask .ibtn { width: 44px; height: 44px; } .ask .go { width: 44px; height: 44px; border-radius: 4px; border: 0; background: var(--amber); color: #1b1203; display: grid; place-items: center; box-shadow: 0 0 18px rgba(255,181,71,.35); }
.ask .go.stop { background: var(--sell); color: #fff; box-shadow: none; }
.prev { flex: none; display: flex; align-items: center; gap: 10px; margin: 0 14px; padding: 7px 10px; border: 1px dashed rgba(255,181,71,.45); border-radius: 4px; font-size: 12.5px; color: var(--amber2); }
.prev span { flex: 1; }

/* settings sheet */
.scrim { position: fixed; inset: 0; z-index: 20; display: none; background: rgba(2,4,8,.72); }
.scrim.open { display: block; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 86%; overflow-y: auto; padding: 18px 18px calc(18px + env(safe-area-inset-bottom)); border-top: 1px solid rgba(255,181,71,.5); background: var(--glass); display: flex; flex-direction: column; gap: 16px; }
.sheet h2 { margin: 0; font: 700 14px/1 var(--f-display); letter-spacing: .26em; text-transform: uppercase; color: var(--amber); display: flex; align-items: center; }
.sheet h2 .spacer { flex: 1; }
.fld { display: flex; flex-direction: column; gap: 6px; }
.fld label, .fld .lab { font: 600 10.5px/1 var(--f-display); letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
.fld input[type="text"], .fld input[type="number"], .fld select { min-height: 42px; padding: 0 12px; border-radius: 4px; border: 1px solid var(--line2); background: var(--glass2); font-size: 16px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opts { display: flex; gap: 6px; flex-wrap: wrap; }
.opts button { min-height: 36px; padding: 0 12px; border-radius: 3px; border: 1px solid var(--line2); background: transparent; font: 600 11px/1 var(--f-display); letter-spacing: .14em; text-transform: uppercase; color: var(--dim); }
.opts button[aria-pressed="true"] { color: #1b1203; background: var(--amber); border-color: var(--amber); }
.voices { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 4px; max-height: 230px; overflow-y: auto; }

  al.slice(0, 3).forEach((a, k) => { if (!m || !m.tv || onCard.some(v => v != null && Math.abs(v - a.p) < 1e-9)) return; const d = Q && Q.p ? (a.p > Q.p ? "up" : a.p < Q.p ? "down" : "cross") : a.dir, done = dkAlFor(x.at, "L" + k), px = esc(fnum(mkSpec(m), a.p));
    h += done ? `<button class="xbtn on" type="button" disabled>✓ Alert set: ${esc(a.act)} ${esc(tk(m))} at ${px}</button>` : `<button class="xbtn" type="button" data-alert="${i}:${k}">◉ Alert my phone: ${esc(a.act)} ${esc(tk(m))} when price ${d === "up" ? "rises to" : d === "down" ? "falls to" : "reaches"} ${px}</button>`; });
  return h;
}
async function dkAlert(btn, m) {
  const [i, k] = btn.dataset.alert.split(":").map(Number), x = dkMsgs(m.k)[i], a = x && dkAlertLines(x.t)[k]; if (!a) return; btn.disabled = true; btn.textContent = "Setting the alert on TradingView…";
  const C = x.c ? dkCallById(x.c) : null, end = C ? C.t + (Math.max(30, C.hold) + (a.act === "EXIT" ? C.hold : 0)) * 6e4 : 0;
  const r = await dkAlertMake(m, a.p, a.dir, a.act, a.note, Object.assign({ cid: x.at, kind: "L" + k }, end ? { min: Math.max(30, (end - Date.now()) / 6e4) } : {}));
  if (r.ok) { hmToast("Alert set. TradingView will notify your phone."); dkPaint(false); paintHead(); } else { btn.disabled = false; btn.textContent = `✗ ${r.msg}`; }
}
async function dkPine(btn) {
  const m = dkM(), [i, k] = btn.dataset.pine.split(":").map(Number), x = dkMsgs(m.k)[i]; if (!x) return; const codes = []; x.t.replace(/```[a-z]*\s*\n([\s\S]*?)```/gi, (_, c) => { if (/\/\/@version\s*=\s*\d/.test(c)) codes.push(c); return ""; }); const code = codes[k]; if (!code) return;
  btn.disabled = true; btn.textContent = "Checking it compiles…";
  try { const v = await tvCall("mcp-tv-validate-pine-script", { code }, false); if (!v || !v.valid) { const er = ((v && v.errors) || [])[0]; btn.textContent = `✗ Doesn't compile${er ? `: line ${er.start && er.start.line}, ${er.message}` : ""}. Ask Quint to fix it.`; return; }
    const nm = ((/(?:indicator|strategy)\(\s*["']([^"']+)/.exec(code) || [])[1] || "Quint script").slice(0, 100), p = await tvCall("mcp-tv-create-pine-script", { code, name: nm }, false);
    btn.textContent = `✓ Saved to your TradingView as “${(p && p.name) || nm}”.`; }
  catch (e) { btn.disabled = false; btn.textContent = /name_taken/i.test(String(e && e.message)) ? "You already have a script with that name on TradingView." : tvWhy(e); }
}
function dkMsgHTML(x, i, m) {
  if (x.r === "u") return `<div class="m u">${x.img ? "[screenshot] " : ""}${esc(x.t)}</div>`;
  const C = x.c ? dkCallById(x.c) : null, body = dkClean(x.t);
  return `<div class="m a" data-i="${i}">${x.busy && !body ? `<p class="think">${esc(DK.prog || "Thinking…")}</p>` : ""}${body ? coachMD(body) : ""}${x.busy && body && DK.prog ? `<p class="think">${esc(DK.prog)}</p>` : ""}${C ? dkCallHTML(C, m) : ""}${dkExtras(x, i)}${x.err ? `<p class="err">${esc(x.err)}</p>` : ""}${!x.busy && body ? `<div class="acts"><button class="chipb say" type="button" aria-pressed="false">Listen</button></div>` : ""}</div>`;
}
function helloHTML(m) {
  const rows = ["1D", "1h", "15m", "5m"].map(mxRow), A = qaAcct();
  return `<div class="hello"><b>Quint online · ${esc(tk(m))}</b><p>${CO.sample ? machineRead(m, rows) : "Quint needs Claude to talk. Open this app inside Claude."}</p><p class="small" style="margin-top:10px">Ask for a call and he answers straight: buy, sell or no trade, with entry, stop and target sized for your ${fbal(A.risk)} risk. Every call is graded afterwards against real candles.</p></div>`;
}
function dkPaint(all) {
  const b = $("#log"); if (!b) return; const m = dkM(), L = dkMsgs(m.k), go = $("#go");
  if (go) { go.classList.toggle("stop", DK.busy); go.setAttribute("aria-label", DK.busy ? "Stop" : "Send"); go.innerHTML = DK.busy ? `<svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="2" width="10" height="10" fill="currentColor"/></svg>` : `<svg width="18" height="18" viewBox="0 0 20 20" aria-hidden="true"><path d="M3 10h12M10 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
  b.innerHTML = L.length ? L.map((x, i) => dkMsgHTML(x, i, m)).join("") : helloHTML(m);
  if (all) b.scrollTop = b.scrollHeight; paintVerdict(); paintChips();
  if (!DK.busy) { const last = L[L.length - 1]; if (last && last.c && !last.seen) { last.seen = 1; paintHead(); if (QA.view !== "console" && !matchMedia("(min-width: 900px)").matches) setView("console"); } }
}
function dkPaintLast() {
  const b = $("#log"), m = dkM(); if (!b) return; const L = dkMsgs(m.k), i = L.length - 1, el = b.querySelector(`.m.a[data-i="${i}"]`); if (!el || !L[i]) { paintVerdict(); return; }
  const near = b.scrollHeight - b.scrollTop - b.clientHeight < 90; el.outerHTML = dkMsgHTML(L[i], i, m); if (near) b.scrollTop = b.scrollHeight; paintVerdict();
}
const CHIPS = [["call", "Call it now"], ["ny", "New York open plan"], ["lv", "Key levels"], ["mg", "Manage my trade"], ["why", "What's moving it"], ["mtf", "Bigger picture"], ["al", "Set my alerts"], ["bt", "Backtest an idea"]];
function paintChips() {
  const el = $("#chips"); if (!el) return; const P = lvPosFor(DK.k);
  el.hidden = DK.busy || !CO.sample; el.innerHTML = CHIPS.filter(([k]) => k !== "mg" || P).map(([k, l]) => `<button type="button" data-qq="${k}">${esc(l)}</button>`).join("");
}
function qaAsk(k) {
  const m = dkM(), n = tk(m), t = $("#q");
  if (k === "bt") { t.value = `Backtest this on ${n}: `; t.focus(); return; }
  if (k === "al") { dkSend(`Set TradingView alerts on my phone for the ${n} levels that matter most right now (two at most), each telling me what to do when price gets there.`); return; }
  dkSend(DK_Q[k](n));
}
function setView(v) { QA.view = v; $("#app").dataset.view = v; $$(".seg [data-v]").forEach(b => b.setAttribute("aria-pressed", b.dataset.v === v)); paintSide(); if (v === "alerts") dkAlertsLoad(false); if (v === "console") { const b = $("#log"); if (b) b.scrollTop = b.scrollHeight; } requestAnimationFrame(() => { drawTape(); drawSess(); coreKick(); }); }
function onLog(e) {
  const m = dkM(); let t;
  if ((t = e.target.closest("[data-qq]"))) { qaAsk(t.dataset.qq); return; }
  if ((t = e.target.closest("[data-cal]"))) { dkCallAlert(t); return; }
  if ((t = e.target.closest("[data-alert]"))) { dkAlert(t, m); return; }
  if ((t = e.target.closest("[data-pine]"))) { dkPine(t); return; }
  if ((t = e.target.closest("[data-in]"))) { const C = dkCallById(+t.dataset.in); if (!C) return; ST.pos = ST.pos || {}; const P = ST.pos[C.k];
    if (P && P.open && P.cid === C.id) { P.open = false; hmToast("Noted: you're out. Quint won't count it as open."); } else { const z = qaSize(MKDEF[C.k], Math.abs(C.entry - C.stop)); ST.pos[C.k] = { open: true, k: C.k, cid: C.id, dir: C.side, qty: Math.max(1, z ? z.qty : 1), e: C.entry, stop: C.stop, tgt: C.tgt, t0: Date.now() }; hmToast("Noted. Quint now treats this as your open trade. Tap again when you're out."); }
    save(); dkPaint(false); return; }
  if ((t = e.target.closest(".say"))) { const i = +t.closest("[data-i]").dataset.i, x = dkMsgs(m.k)[i]; if (x) qaSpeak(dkClean(x.t), t); return; }
  if ((t = e.target.closest("[data-aldel]"))) { dkAlertDel(t); return; }
  if (e.target.closest("#alr")) { dkAlertsLoad(true); return; }
}

/* ---------- settings: account, risk, style and voice ---------- */
function openSet() {
  const s = ST.set, sh = $("#sheet");
  sh.innerHTML = `<h2 id="sheth">Settings <span class="spacer"></span><button class="ibtn" type="button" id="setx" aria-label="Close settings">✕</button></h2>
    <div class="two"><div class="fld"><label for="sname">Account</label><input type="text" id="sname" value="${esc(s.name)}" maxlength="40"></div><div class="fld"><label for="ssize">Size ($)</label><input type="number" id="ssize" inputmode="numeric" min="1000" step="1000" value="${esc(s.acct)}"></div></div>
    <div class="fld"><label for="spct">Risk per trade: <span id="spctv">${esc(s.pct)}% = ${fbal(qaAcct().risk)}</span></label><input type="range" id="spct" min="0.25" max="3" step="0.25" value="${esc(s.pct)}"></div>
    <div class="fld"><span class="lab">How you trade</span><div class="opts" role="group" aria-label="How you trade">${[["scalp", "Scalper"], ["day", "Day trader"], ["both", "Both"]].map(([k, l]) => `<button type="button" data-st="${k}" aria-pressed="${TS() === k}">${l}</button>`).join("")}</div></div>
    <div class="fld"><span class="lab">Quint's voice</span><p class="small" id="vnote"></p><div class="voices" id="vlist"></div></div>
    <div class="fld"><label for="srate">Speaking speed: <span id="sratev">${(+s.rate || 1).toFixed(2)}×</span></label><input type="range" id="srate" min="0.7" max="1.5" step="0.05" value="${esc(s.rate || 1)}"></div>
    <p class="small">Prices come from your TradingView connector${MK.tvLive ? ", with real-time CME data" : " (futures run about 10 minutes behind without real-time CME data)"}. Calls, alerts and settings are kept on this device. Quint makes calls to help you learn and decide; he can be wrong, and nothing here places real orders.</p>`;
  $("#scrim").classList.add("open"); paintVoices();
  $("#setx").onclick = closeSet; $("#scrim").onclick = e => { if (e.target.id === "scrim") closeSet(); };
  $("#sname").oninput = e => { s.name = e.target.value.slice(0, 40); save(); };
  $("#ssize").oninput = e => { const v = +e.target.value; if (v >= 1000) { s.acct = v; save(); $("#spctv").textContent = `${s.pct}% = ${fbal(qaAcct().risk)}`; } };
  $("#spct").oninput = e => { s.pct = +e.target.value; save(); $("#spctv").textContent = `${s.pct}% = ${fbal(qaAcct().risk)}`; };
  $$("[data-st]", sh).forEach(b => b.onclick = () => { s.style = b.dataset.st; save(); $$("[data-st]", sh).forEach(x => x.setAttribute("aria-pressed", x === b)); });
  $("#srate").oninput = e => { s.rate = +e.target.value; save(); $("#sratev").textContent = `${s.rate.toFixed(2)}×`; try { QT.tts && QT.tts.setRate && QT.tts.setRate(s.rate).catch(() => {}); } catch (err) {} };
  setTimeout(() => $("#setx").focus(), 30);
}
function closeSet() { $("#scrim").classList.remove("open"); paintAll(); $("#setb").focus(); }
function paintVoices() {
  const el = $("#vlist"), note = $("#vnote"); if (!el) return; const s = ST.set;
  if (QT.tts) { note.textContent = "Claude's own voices, available here."; el.innerHTML = ["buttery", "airy", "glassy", "rounded"].map(v => `<button type="button" data-tv="${v}" aria-pressed="${(s.tvoice || "buttery") === v}"><span>${v[0].toUpperCase() + v.slice(1)}</span><small>Claude</small></button>`).join("");
    $$("[data-tv]", el).forEach(b => b.onclick = () => { s.tvoice = b.dataset.tv; save(); paintVoices(); QT.speaking = false; qaSpeak("This is Quint. I'll tell you straight: buy, sell, or stay out.", null); }); return; }
  const vs = voiceList().filter(v => /^en/i.test(v.lang)).sort((a, b) => voiceScore(b) - voiceScore(a)), cur = voicePick();
  note.textContent = "On iPhone the Claude app doesn't let pages use Claude's own voice, so Quint uses your phone's voices. The robotic ones are at the bottom; tap one to hear it.";
  el.innerHTML = vs.length ? vs.map(v => `<button type="button" data-vu="${esc(v.voiceURI || v.name)}" aria-pressed="${!!cur && (cur.voiceURI || cur.name) === (v.voiceURI || v.name)}"><span>${esc(v.name.replace(/\s*\(.*\)$/, ""))}${voiceScore(v) < 0 ? " · robotic" : ""}</span><small>${esc(v.lang)}${/premium/i.test(v.name + v.voiceURI) ? " · premium" : /enhanced/i.test(v.name + v.voiceURI) ? " · enhanced" : ""}</small></button>`).join("") : `<p class="small" style="padding:10px 12px">No voices are listed yet. Tap Listen on any answer and they'll load.</p>`;
  $$("[data-vu]", el).forEach(b => b.onclick = () => { s.voice = b.dataset.vu; save(); paintVoices(); QT.speaking = false; qaSpeak("This is Quint. I'll tell you straight: buy, sell, or stay out.", null); });
}

/* ---------- typing on a phone: the instruments fold away and the box sits on the keyboard ---------- */
function fitVV() { const vv = window.visualViewport; if (!vv) return; document.documentElement.style.setProperty("--vvh", vv.height + "px"); $("#app").style.top = vv.offsetTop + "px"; const b = $("#log"); if (b) b.scrollTop = b.scrollHeight; }
function kbOn(on) { const app = $("#app"), vv = window.visualViewport; app.classList.toggle("typing", on && window.innerWidth < 900);
  if (vv) { if (on) { vv.addEventListener("resize", fitVV); vv.addEventListener("scroll", fitVV); fitVV(); } else { vv.removeEventListener("resize", fitVV); vv.removeEventListener("scroll", fitVV); document.documentElement.style.removeProperty("--vvh"); app.style.top = ""; } }
  if (!on) requestAnimationFrame(() => { drawTape(); drawSess(); coreKick(); }); }
function paintImg() { let p = $("#prev"); if (!DK.img) { if (p) p.remove(); return; } if (!p) { p = document.createElement("div"); p.id = "prev"; p.className = "prev"; $("#askf").before(p); } p.innerHTML = `<span>Screenshot attached. Ask a question, or just send.</span><button class="btn sm" type="button" id="imgx">Remove</button>`; $("#imgx").onclick = () => { DK.img = null; paintImg(); }; }

function qaStart() {
  fillMarkets(); const m = dkM(); $("#q").placeholder = `Ask Quint: buy or sell ${tk(m)}?`; setView(QA.view);
  $$(".seg [data-v]").forEach(b => b.onclick = () => setView(b.dataset.v));
  $("#log").addEventListener("click", onLog); $("#side").addEventListener("click", onLog); $("#chips").addEventListener("click", onLog);

  ta.oninput = fit; ta.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); $("#askf").requestSubmit(); } };
  ta.addEventListener("focus", () => kbOn(true)); ta.addEventListener("blur", () => setTimeout(() => { if (document.activeElement !== ta) kbOn(false); }, 150));

    if (QA.view !== "console" && !matchMedia("(min-width: 900px)").matches) setView("console"); dkSend(v || "Read my chart and give me your call.", DK.img ? { img: DK.img } : {}); DK.img = null; paintImg(); };

  setInterval(() => { drawSess(); paintVerdict(); paintHead(); }, 30000);

  paintAll(); coreKick(); qaInit();
}


if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', qaStart); else qaStart();
})();
